<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 302" role="img" aria-labelledby="b51-lego-t b51-lego-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-lego-t">Smooth from far, pieces up close</title><desc id="b51-lego-d">Left: a wall of blocks seen from far away looks like one smooth block. Right: the same wall zoomed in shows it is made of many small bricks. Matter is similar: it looks smooth but is made of tiny particles.</desc><rect x="0" y="0" width="480" height="302" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Smooth from far, pieces up close</text><rect x="14" y="50" width="210" height="200" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="119" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">From far away</text><rect x="54" y="100" width="130" height="90" rx="0" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="119" y="220" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">it looks smooth</text><rect x="256" y="50" width="210" height="200" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="361" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Up close</text><rect x="280" y="96" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="320" y="96" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="360" y="96" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="400" y="96" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="294" y="124" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="334" y="124" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="374" y="124" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="414" y="124" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="280" y="152" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="320" y="152" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="360" y="152" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="400" y="152" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="294" y="180" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="334" y="180" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="374" y="180" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="414" y="180" width="38" height="24" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="361" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">it is made of pieces</text><line x1="190" y1="145" x2="242.1" y2="145.0" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="252,145 242.1,151.1 242.1,138.9" fill="var(--ink, #12172B)"/><text x="240" y="282" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Matter is like that: smooth to the eye, tiny pieces up close.</text></svg>