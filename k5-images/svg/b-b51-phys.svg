<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="b51-phys-t b51-phys-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-phys-t">Physical and chemical changes</title><desc id="b51-phys-d">Two panels. Physical change: ice melts into water, which is still water and can freeze again. Chemical change: vinegar and baking soda in a bag make bubbles of new gas, a new substance.</desc><rect x="0" y="0" width="480" height="290" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Physical and chemical changes</text><text x="120" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Physical change</text><text x="360" y="64" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Chemical change</text><rect x="60" y="90" width="44" height="44" rx="6" fill="var(--reflect, #2B66E8)" fill-opacity="0.35" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="82" y="156" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">ice</text><line x1="110" y1="112" x2="140.1" y2="112.0" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="150,112 140.1,118.0 140.1,106.0" fill="var(--absorb, #D6450B)"/><path d="M170 100 q-20 40 0 50 q22 -10 0 -50z" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="170" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">water</text><text x="120" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Still water.</text><text x="120" y="221.86" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Same stuff, new form.</text><line x1="240" y1="56" x2="240" y2="250" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><rect x="300" y="90" width="100" height="70" rx="14" fill="var(--beam, #F2A900)" fill-opacity=".35" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="350" y="120" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">bag</text><circle cx="320" cy="138" r="5" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="350" cy="138" r="5" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="380" cy="138" r="5" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="350" y="180" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">bubbles: new gas</text><text x="360" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">A new substance</text><text x="360" y="221.86" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">was made.</text><text x="240" y="250" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Melting: reversible by freezing. Fizzing: a new gas forms.</text><text x="240" y="270" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Rust is also chemical: iron becomes a new, flaky substance.</text></svg>