<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 236" role="img" aria-labelledby="b44-cactus-t b44-cactus-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b44-cactus-t">Spines help a cactus survive</title><desc id="b44-cactus-d">A drawn cactus with spines. A label says the spines protect it from animals and shade it a little. A thick green stem stores water.</desc><rect x="0" y="0" width="480" height="236" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Spines help a cactus survive</text><rect x="215" y="70" width="50" height="150" rx="24" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="150" y="130" width="24" height="60" rx="12" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="160" y="175" width="70" height="22" rx="11" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="306" y="110" width="24" height="60" rx="12" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="255" y="150" width="70" height="22" rx="11" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="3"/><line x1="266" y1="80" x2="278" y2="72" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="214" y1="110" x2="202" y2="102" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="266" y1="140" x2="278" y2="132" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="214" y1="170" x2="202" y2="162" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="266" y1="200" x2="278" y2="192" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="220" x2="480" y2="220" stroke="var(--line, #D0D8E8)" stroke-width="2" stroke-linecap="round"/><text x="300" y="80" text-anchor="start" font-size="13.5" font-weig