<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" role="img" aria-labelledby="b32-week-t b32-week-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b32-week-t">One day versus the average</title><desc id="b32-week-d">A made-up week of July daily highs shown as seven orange dots between 75 and 90 degrees F. A dashed teal line marks the Detroit July typical high of 83 degrees F. Some days are above the line and some below it.</desc><rect x="0" y="0" width="480" height="372" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">One day versus the average</text><line x1="60" y1="270" x2="450" y2="270" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="52" y="274" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">60</text><line x1="60" y1="226" x2="450" y2="226" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="52" y="230" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">70</text><line x1="60" y1="182" x2="450" y2="182" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="52" y="186" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">80</text><line x1="60" y1="138" x2="450" y2="138" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="52" y="142" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">90</text><line x1="60" y1="94" x2="450" y2="94" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="52" y="98" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">100</text><text transform="translate(14 170) rotate(-90)" text-anchor="middle" font-size="12.5" fill="var(--muted, #47506E)">High temperature (degrees F)</text><line x1="60" y1="168.8" x2="450" y2="168.8" stroke="var