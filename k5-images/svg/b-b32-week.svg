t="400" fill="var(--muted, #47506E)">4</text><circle cx="288" cy="204" r="9" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="288" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #12172B)">75</text><text x="288" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Day</text><text x="288" y="310.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">5</text><circle cx="340" cy="164.39999999999998" r="9" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="340" y="149.39999999999998" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #12172B)">84</text><text x="340" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Day</text><text x="340" y="310.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">6</text><circle cx="392" cy="168.8" r="9" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="392" y="153.8" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #12172B)">83</text><text x="392" y="296" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Day</text><text x="392" y="310.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">7</text><text x="240" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">One day can be far from the average.</text><text x="240" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="var(--transmit, #0B7F70)">The average of many years tells the climate.</text></svg>