<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="g-51-mass-t g-51-mass-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-51-mass-t">Sample data (not measured): mass before and after</title><desc id="g-51-mass-d">Grouped bar graph of sample mass in grams (not measured). Sealed cup of ice melting: 82 before, 82 after. Sealed bag with baking soda and vinegar: 45 before, 45 after. Each pair is the same height.</desc><defs><pattern id="g-51-mass-p1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--transmit, #0B7F70)"/><rect width="2.5" height="6" fill="rgba(255,255,255,.45)"/></pattern></defs><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Sample data (not measured): mass before and after</text><line x1="54" x2="464" y1="250" y2="250" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="255" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">0</text><line x1="54" x2="464" y1="212.4" y2="212.4" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="217.4" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">20</text><line x1="54" x2="464" y1="174.8" y2="174.8" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="179.8" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">40</text><line x1="54" x2="464" y1="137.2" y2="137.2" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="142.2" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">60</text><line x1="54" x2="464" y1="99.6" y2="99.6" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="104.6" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">80</text><line x1="54" x2="464" y1="62" y2="62" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="67" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">100</text><text transform="translate(14 156) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">Mass (g)</text><rect x="103.5" y="95.84" width="52" height="154.16" rx="3" fill="var(--reflect, #2B66E8)" /><text x="129.5" y="89.84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">82</text><rect x="157.5" y="95.84" width="52" height="154.16" rx="3" fill="url(#g-51-mass-p1)" /><text x="183.5" y="89.84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">82</text><text x="156.5" y="270" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Sealed cup of</text><text x="156.5" y="285" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">ice melting</text><rect x="308.5" y="165.39999999999998" width="52" height="84.60000000000002" rx="3" fill="var(--reflect, #2B66E8)" /><text x="334.5" y="159.39999999999998" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">45</text><rect x="362.5" y="165.39999999999998" width="52" height="84.60000000000002" rx="3" fill="url(#g-51-mass-p1)" /><text x="388.5" y="159.39999999999998" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">45</text><text x="361.5" y="270" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Sealed bag:</text><text x="361.5" y="285" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">baking soda +</text><text x="361.5" y="300" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">vinegar</text><line x1="54" x2="464" y1="250" y2="250" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="54" y="305" width="14" height="14" rx="3" fill="var(--reflect, #2B66E8)"/><text x="74" y="317" font-size="13" fill="var(--ink, #12172B)">Before</text><rect x="133.2" y="305" width="14" height="14" rx="3" fill="url(#g-51-mass-p1)"/><text x="153.2" y="317" font-