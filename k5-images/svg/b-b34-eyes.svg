<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="b34-eyes-t b34-eyes-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b34-eyes-t">Many eyes see danger sooner</title><desc id="b34-eyes-d">Two panels. Left: one deer alone with one pair of eyes that may miss a wolf. Right: a herd of five deer with many pairs of eyes, so someone sees danger sooner. A note says the trade-off is that a herd must share food and space.</desc><rect x="0" y="0" width="480" height="320" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Many eyes see danger sooner</text><rect x="16" y="44" width="210" height="200" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><rect x="254" y="44" width="210" height="200" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="121" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">One deer alone</text><g transform="translate(100 150) scale(1.4)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v12 M10 8 v12" stroke="var(--ink, #12172B)" stroke-width="2.5"/><circle cx="24" cy="-17" r="2" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/></g><path d="M103 100 Q112 93 121 100 Q112 107 103 100Z" fill="var(--surface, #fff)" stroke="var(--reflect, #2B66E8)" stroke-width="2"/><circle cx="112" cy="100" r="2.5" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="121" y="210" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">1 pair of eyes</text><text x="121" y="230" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">may miss the wolf</text><text x="359" y="70" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">A herd of deer</text><g transform="translate(300 150) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v12 M10 8 v12" stroke="var(--ink, #12172B)" stroke-width="2.5"/><circle cx="24" cy="-17" r="2" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/></g><path d="M299 108 Q308 101 317 108 Q308 115 299 108Z" fill="var(--surface, #fff)" stroke="var(--reflect, #2B66E8)" stroke-width="2"/><circle cx="308" cy="108" r="2.5" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><g transform="translate(350 170) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v12 M10 8 v12" stroke="var(--ink, #12172B)" stroke-width="2.5"/><circle cx="24" cy="-17" r="2" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/></g><path d="M349 136 Q358 129 367 136 Q358 143 349 136Z" fill="var(--surface, #fff)" stroke="var(--reflect, #2B66E8)" stroke-width="2"/><circle cx="358" cy="136" r="2.5" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><g transform="translate(400 150) scale(0.8)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v12 M10 8 v12" stroke="var(--ink, #12172B)" stroke-width="2.5"/><circle cx="24" cy="-17" r="2" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/></g><path d="M399 108 Q408 101 417 108 Q