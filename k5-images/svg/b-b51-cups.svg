<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="b51-cups-t b51-cups-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-cups-t">Ice, water and water vapor</title><desc id="b51-cups-d">Three cups. The first holds an ice cube that keeps its own shape. The second holds liquid water that fills the bottom of the cup. The third has a few scattered dots for water vapor, an invisible gas that spreads through the whole cup.</desc><rect x="0" y="0" width="480" height="270" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Ice, water and water vapor</text><path d="M30 80 L44 170 H106 L120 80" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Ice</text><text x="75" y="216" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">keeps its shape</text><path d="M190 80 L204 170 H266 L280 80" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="235" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Water</text><text x="235" y="216" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">takes the cup shape</text><path d="M350 80 L364 170 H426 L440 80" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Water vapor</text><text x="395" y="216" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">spreads out, invisible</text><rect x="48" y="110" width="38" height="38" rx="4" fill="var(--reflect, #2B66E8)" fill-opacity="0.35" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M205 120 H275 L270 170 H210Z" fill="var(--reflect, #2B66E8)" fill-opacity="0.5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="100" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="410" cy="120" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="385" cy="145" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="430" cy="90" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="350" cy="130" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="440" cy="150" r="3" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="240" y="250" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">The cloud over a kettle is tiny droplets of liquid water, not vapor.</text></svg>