<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" role="img" aria-labelledby="d-53-docks-t d-53-docks-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-53-docks-t">What a plant builds from</title><desc id="d-53-docks-d">Two docks feeding a plant. Matter dock on the left, matter has mass: air, water and a very small amount of tiny minerals each have an arrow into the plant. Energy dock on the right, energy has no mass: sunlight has one arrow into the plant and powers the work but adds no mass. A tree grew from 2 kilograms to 50 kilograms while the soil lost only 0.1 kilogram, so most of the new mass came from air and water. Sunlight is energy, not matter, so it does not become plant mass.</desc><rect x="0" y="0" width="480" height="324" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">What a plant builds from</text><text x="81" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--transmit, #0B7F70)">MATTER (has mass)</text><text x="399" y="56" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--absorb, #D6450B)">ENERGY (no mass)</text><rect x="16" y="70" width="130" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--transmit, #0B7F70)" stroke-width="1.5"/><text x="81" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Air</text><text x="81" y="103" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">from the air</text><line x1="146" y1="90" x2="182.48537615844847" y2="114.0471797407956" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="190,119 179.45865266671245,118.63944986618819 185.5120996501845,109.45490961540301" fill="var(--transmit, #0B7F70)"/><rect x="16" y="122" width="130" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--transmit, #0B7F70)" stroke-width="1.5"/><text x="81" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Water</text><text x="81" y="155" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">from the soil</text><line x1="146" y1="142" x2="181.1825656094569" y2="134.80356612533836" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="190,133 182.28474490827477,140.19199825289246 180.08038631063903,129.41513399778427" fill="var(--transmit, #0B7F70)"/><rect x="16" y="174" width="130" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--transmit, #0B7F70)" stroke-width="1.5"/><text x="81" y="191" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Tiny minerals</text><text x="81" y="207" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">a very small amount</text><line x1="146" y1="194" x2="183.8491814072698" y2="153.57019258768906" stroke="var(--transmit, #0B7F70)" stroke-width="1.5" stroke-linecap="round"/><polygon points="190,147 187.86429909974646,157.3290261721353 179.83406371479316,149.81135900324284" fill="var(--transmit, #0B7F70)"/><rect x="190" y="100" width="100" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--green, #25904F)" stroke-width="1.5"/><text x="240" y="131" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Plant</text><text x="240" y="150" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">builds new</text><text x="240" y="164" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">plant material</text><line x1="421" y1="118" x2="431" y2="118" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="416.79837387624883" y1="130.9312755504344" x2="424.8885438199983" y2="136.80912807335915" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="405.79837387624883" y1="138.92324335849338" x2="408.8885438199983" y2="148.43380852144492" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="392.20162612375117" y1="138.92324335849338" x2="389.1114561800017" y2="148.43380852144492" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="381.20162612375117" y1="130.9312755504344" x2="373.1114561800017" y2="136.80912807335915" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="377" y1="118" x2="367" y2="118" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="381.20162612375117" y1="105.0687244495656" x2="373.1114561800017" y2="99.19087192664087" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="392.20162612375117" y1="97.07675664150662" x2="389.11145618000165" y2="87.56619147855508" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="405.79837387624883" y1="97.07675664150662" x2="408.8885438199983" y2="87.56619147855508" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="416.79837387624883" y1="105.0687244495656" x2="424.8885438199983" y2="99.19087192664085" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><circle cx="399" cy="118" r="17" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="399" y="172" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Sunlight</text><line x1="372" y1="132" x2="302.74640165426786" y2="138.92535983457321" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="292,140 302.0896771087293,132.3581143791873 303.4031261998064,145.49260528995913" fill="var(--beam, #F2A900)"/><text x="380" y="192" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">powers the work,</text><text x="380" y="206" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">adds no mass</text><line x1="20" x2="460" y1="236" y2="236" stroke="var(--line, #D0D8E8)"/><text x="240" y="262" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">The tree went from 2 kg to 50 kg. The soil lost only 0.1 kg.</text><text x="240" y="284" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Most of the new mass came from air and water.</text><text x="240" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--absorb, #D6450B)">Sunlight is energy. It is not matter, so it does not become plant mass.</text></svg>
