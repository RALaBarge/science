<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="b45-copper-t b45-copper-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b45-copper-t">Copper from rock</title><desc id="b45-copper-d">A lumpy rock drawn with orange-brown copper veins running through it. A label says Michigan has copper in its rock.</desc><rect x="0" y="0" width="480" height="240" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Copper from rock</text><path d="M90 190 Q70 130 120 90 Q190 50 270 70 Q380 80 390 150 Q400 200 330 205 Q200 215 90 190Z" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 160 Q180 120 230 140 Q280 160 340 120" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 110 Q200 150 190 190" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Orange-brown lines are copper in the rock.</text></svg>