<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="b42-flash-t b42-flash-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b42-flash-t">A flashlight has a switch inside</title><desc id="b42-flash-d">A flashlight drawn from the side. Batteries on the left, a switch on the top, and a bulb on the right joined by a loop of metal. When the switch is closed the loop is complete and the bulb lights.</desc><rect x="0" y="0" width="480" height="270" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A flashlight has a switch inside</text><rect x="60" y="100" width="280" height="70" rx="14" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="76" y="118" width="60" height="34" rx="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="140" y="118" width="60" height="34" rx="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="138" y="192" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">batteries</text><rect x="230" y="82" width="56" height="18" rx="6" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="258" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">switch</text><path d="M200 135 H230 V100" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M286 100 V135 H320" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="340,92 400,60 400,180 340,148" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linejoin="round"/><circle cx="366" cy="120" r="12" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="382.0" y1="120.0" x2="392.0" y2="120.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="377.3" y1="131.3" x2="384.4" y2="138.4" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="366.0" y1="136.0" x2="366.0" y2="146.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="354.7" y1="131.3" x2="347.6" y2="138.4" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="350.0" y1="120.0" x2="340.0" y2="120.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="354.7" y1="108.7" x2="347.6" y2="101.6" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="366.0" y1="104.0" x2="366.0" y2="94.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="377.3" y1="108.7" x2="384.4" y2="101.6" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><text x="366" y="214" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">bulb</text><text x="240" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Press the switch: the loop closes and the bulb lights.</text></svg>