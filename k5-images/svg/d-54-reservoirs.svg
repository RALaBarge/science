<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" role="img" aria-labelledby="d-54-reservoirs-t d-54-reservoirs-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-54-reservoirs-t">Where Earth’s water is</title><desc id="d-54-reservoirs-d">A side view of Earth’s water. On the left is the ocean, salt water, about 97 percent of all water. On the right are land, a mountain with ice and glaciers on top, a layer of fresh groundwater under the ground, and a small lake and river. About 3 percent of Earth’s water is fresh. Most of that fresh water is frozen in ice or underground. Lakes and rivers hold only a tiny part.</desc><rect x="0" y="0" width="480" height="324" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Where Earth’s water is</text><rect x="20" y="48" width="440" height="214" rx="10" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><path d="M200 156 H460 V262 H200Z" fill="#C8A46E" opacity=".5"/><path d="M206 224 H454 V250 H206Z" fill="var(--reflect, #2B66E8)" opacity=".28"/><circle cx="220" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><circle cx="260" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><circle cx="300" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><circle cx="340" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><circle cx="380" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><circle cx="420" cy="237" r="3" fill="var(--reflect, #2B66E8)"/><path d="M20 156 H200 V262 H20Z" fill="var(--reflect, #2B66E8)" opacity=".35"/><path d="M34 176 q10 -8 20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="3"/><line x1="200" y1="156" x2="200" y2="262" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M300 156 L352 78 L404 156Z" fill="#8F96A8" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M335 102 L352 78 L369 102 L360 108 L352 100 L344 108Z" fill="#FFFFFF" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M300 156 Q252 150 232 158 T200 156" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="4"/><ellipse cx="426" cy="170" rx="24" ry="8" fill="var(--reflect, #2B66E8)" opacity=".7" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="110" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Ocean</text><text x="110" y="221" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">salt water</text><text x="110" y="240" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">about 97% of all water</text><text x="352" y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Ice: frozen fresh water</text><text x="330" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Groundwater: fresh, underground</text><text x="408" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Lakes and rivers</text><text x="240" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">About 3% is fresh water. Most of that is ice or underground.</text><text x="240" y="304" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">The lakes and rivers we use easily hold only a tiny part.</text></svg>
