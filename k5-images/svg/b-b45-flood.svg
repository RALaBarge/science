<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="b45-flood-t b45-flood-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b45-flood-t">High water hurts a shore</title><desc id="b45-flood-d">A side view of a lake shore. Waves are high and splash up the sand toward a house. Some sand has been washed away, and a small wall of rocks is placed near the water to slow the waves.</desc><rect x="0" y="0" width="480" height="250" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">High water hurts a shore</text><rect x="0" y="130" width="160" height="80" rx="0" fill="var(--reflect, #2B66E8)" fill-opacity=".5" stroke="none" stroke-width="0"/><path d="M0 140 q20 -24 40 0 t40 0 t40 0 t40 0" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="160,130 480,170 480,210 160,210" fill="var(--beam, #F2A900)" fill-opacity=".5" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linejoin="round"/><circle cx="170" cy="146" r="9" fill="var(--muted, #47506E)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="188" cy="146" r="9" fill="var(--muted, #47506E)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="206" cy="146" r="9" fill="var(--muted, #47506E)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="380" y="86" width="70" height="60" rx="0" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="2"/><polygon points="374,86 415,56 456,86" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="128" x2="151.2" y2="121.8" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round"/><polygon points="160,120 152.3,127.2 150.1,116.4" fill="var(--reflect, #2B66E8)"/><text x="240" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">High water pushes in. Rocks slow the waves.</text></svg>