<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="b31-crit-t b31-crit-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b31-crit-t">Criteria and constraints</title><desc id="b31-crit-d">Two boxes. Criterion: what the design must do. The clip moves at least 20 centimeters and no hand touches it. Constraint: what you must use. One magnet, one paper clip, paper or card.</desc><rect x="0" y="0" width="480" height="290" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Criteria and constraints</text><rect x="20" y="48" width="210" height="170" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--reflect, #2B66E8)" stroke-width="1.5"/><text x="125" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="var(--reflect, #2B66E8)">Criterion</text><text x="125" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">what it must DO</text><text x="125" y="132" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">The clip moves</text><text x="125" y="152" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">at least 20 cm.</text><text x="125" y="172" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)"></text><text x="125" y="192" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">No hand touches</text><text x="125" y="212" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">the clip.</text><rect x="250" y="48" width="210" height="170" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--absorb, #D6450B)" stroke-width="1.5"/><text x="355" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="var(--absorb, #D6450B)">Constraint</text><text x="355" y="98" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">what you must USE</text><text x="355" y="132" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">One magnet.</text><text x="355" y="152" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">One paper clip.</text><text x="355" y="172" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">Paper or card.</text><text x="355" y="192" text-anchor="middle" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">Nothing else.</text><text x="240" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">A good design meets the criterion</text><text x="240" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">and stays inside the constraints.</text></svg>