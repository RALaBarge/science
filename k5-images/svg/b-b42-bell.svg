<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-labelledby="b42-bell-t b42-bell-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b42-bell-t">A doorbell changes electric energy to sound</title><desc id="b42-bell-d">Three boxes joined by arrows: a button that closes the circuit, electric current, and a bell. The bell makes sound.</desc><rect x="0" y="0" width="480" height="230" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A doorbell changes electric energy to sound</text><circle cx="70" cy="110" r="30" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="70" y="160" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">push button</text><line x1="110" y1="110" x2="179.2" y2="110.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="190,110 179.2,116.6 179.2,103.4" fill="var(--transmit, #0B7F70)"/><text x="150" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">current</text><path d="M250 130 q0 -50 20 -60 q20 10 20 60 z" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="270" cy="136" r="6" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><text x="270" y="168" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">bell</text><line x1="320" y1="100" x2="371.6" y2="79.3" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="380,76 373.7,84.4 369.6,74.2" fill="var(--ink, #12172B)"/><line x1="322" y1="112" x2="387.0" y2="112.0" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="396,112 387.0,117.5 387.0,106.5" fill="var(--ink, #12172B)"/><line x1="320" y1="126" x2="371.6" y2="146.7" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="380,150 369.6,151.8 373.7,141.6" fill="var(--ink, #12172B)"/><text x="430" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">sound</text></svg>