<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="g-41-cool-t g-41-cool-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-41-cool-t">Cooling data</title><desc id="g-41-cool-d">Line graph of temperature in degrees C over three readings: 40, 37 and 35. The line slopes down.</desc><rect x="0" y="0" width="480" height="320" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Cooling data</text><line x1="56" x2="460" y1="258" y2="258" stroke="var(--line, #D0D8E8)"/><text x="48" y="263" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">30</text><line x1="56" x2="460" y1="192.66666666666669" y2="192.66666666666669" stroke="var(--line, #D0D8E8)"/><text x="48" y="197.66666666666669" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">35</text><line x1="56" x2="460" y1="127.33333333333334" y2="127.33333333333334" stroke="var(--line, #D0D8E8)"/><text x="48" y="132.33333333333334" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">40</text><line x1="56" x2="460" y1="62" y2="62" stroke="var(--line, #D0D8E8)"/><text x="48" y="67" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">45</text><text x="56" y="278" text-anchor="middle" font-size="13" fill="var(--ink, #12172B)">1</text><text x="258" y="278" text-anchor="middle" font-size="13" fill="var(--ink, #12172B)">2</text><text x="460" y="278" text-anchor="middle" font-size="13" fill="var(--ink, #12172B)">3</text><text x="258" y="306" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">Reading</text><text transform="translate(14 160) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">Temperature (C)</text><line x1="56" x2="460" y1="258" y2="258" stroke="var(--ink, #12172B)" stroke-width="1.5"/><polyline fill="none" stroke="var(--absorb, #D6450B)" stroke-width="3" points="56,127.33333333333334 258,