<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 308" role="img" aria-labelledby="b34-habitats-t b34-habitats-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b34-habitats-t">Michigan habitats</title><desc id="b34-habitats-d">Three habitats: a pond with water and a frog, a forest with trees and a deer, and a sandy dune with beach grass. A note says each living thing fits some places better than others.</desc><rect x="0" y="0" width="480" height="308" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Michigan habitats</text><rect x="10" y="44" width="150" height="190" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><rect x="165" y="44" width="150" height="190" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><rect x="320" y="44" width="150" height="190" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="85" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Pond</text><text x="240" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Forest</text><text x="395" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Dune</text><path d="M20 160 Q85 140 150 160 V224 H20Z" fill="var(--reflect, #2B66E8)" fill-opacity=".4" stroke="var(--reflect, #2B66E8)" stroke-width="2"/><ellipse cx="85" cy="190" rx="16" ry="9" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="96" cy="185" r="3" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><text x="85" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">frog</text><line x1="240" y1="130" x2="240" y2="195" stroke="var(--ink, #12172B)" stroke-width="6" stroke-linecap="round"/><path d="M240 85 L206 148 H274Z" fill="var(--green, #25904F)" fill-opacity=".6" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M240 108 L212 165 H268Z" fill="var(--green, #25904F)" fill-opacity=".6" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="240" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">tree, deer</text><path d="M330 200 Q395 170 460 200 V224 H330Z" fill="var(--beam, #F2A900)" fill-opacity=".5" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M370 188 q-3 -26 -8 -34 M370 188 q2 -28 8 -34 M370 188 v-40" fill="none" stroke="var(--green, #25904F)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M395 188 q-3 -26 -8 -34 M395 188 q2 -28 8 -34 M395 188 v-40" fill="none" stroke="var(--green, #25904F)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M420 188 q-3 -26 -8 -34 M420 188 q2 -28 8 -34 M420 188 v-40" fill="none" stroke="var(--green, #25904F)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">beach grass</text><text x="240" y="266" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Each living thing fits some places better than others.</text><text x="240" y="288" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">A fish cannot live on land. A frog cannot live on a dry dune.</text></svg>