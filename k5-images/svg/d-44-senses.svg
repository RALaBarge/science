<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" aria-labelledby="d-44-senses-t d-44-senses-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-44-senses-t">Sense, brain, response</title><desc id="d-44-senses-d">Three rows, each a chain of three boxes with arrows pointing left to right: a sense takes in information, the brain works on it, and the body responds. Row 1: eyes see a ball coming, the brain gets the message, the hands move to catch it. Row 2: skin feels a hot pan, the brain gets the message, the hand pulls away. Row 3: ears hear a bell, the brain gets the message, you walk to the door. Information goes in first, then the brain works on it, then the body responds, in one direction.</desc><rect x="0" y="0" width="480" height="344" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Sense, brain, response</text><text x="80" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">1  Sense takes in</text><text x="240" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">2  Brain works on it</text><text x="400" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">3  Body responds</text><rect x="16" y="72" width="128" height="54" rx="8" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="80" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">Eyes see</text><text x="80" y="112" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">a ball coming</text><line x1="146" y1="99" x2="165" y2="99" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="174,99 165,104.5 165,93.5" fill="var(--ink, #12172B)"/><rect x="176" y="72" width="128" height="54" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Brain gets</text><text x="240" y="112" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">the message</text><line x1="306" y1="99" x2="325" y2="99" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="334,99 325,104.5 325,93.5" fill="var(--ink, #12172B)"/><rect x="336" y="72" width="128" height="54" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="400" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">Hands move</text><text x="400" y="112" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">to catch it</text><rect x="16" y="142" width="128" height="54" rx="8" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="80" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">Skin feels</text><text x="80" y="182" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">a hot pan</text><line x1="146" y1="169" x2="165" y2="169" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="174,169 165,174.5 165,163.5" fill="var(--ink, #12172B)"/><rect x="176" y="142" width="128" height="54" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Brain gets</text><text x="240" y="182" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">the message</text><line x1="306" y1="169" x2="325" y2="169" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="334,169 325,174.5 325,163.5" fill="var(--ink, #12172B)"/><rect x="336" y="142" width="128" height="54" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="400" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">Hand pulls</text><text x="400" y="182" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">away</text><rect x="16" y="212" width="128" height="54" rx="8" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="80" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">Ears hear</text><text x="80" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">a bell</text><line x1="146" y1="239" x2="165" y2="239" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="174,239 165,244.5 165,233.5" fill="var(--ink, #12172B)"/><rect x="176" y="212" width="128" height="54" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Brain gets</text><text x="240" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">the message</text><line x1="306" y1="239" x2="325" y2="239" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="334,239 325,244.5 325,233.5" fill="var(--ink, #12172B)"/><rect x="336" y="212" width="128" height="54" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="400" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">You walk</text><text x="400" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--on-color, #fff)">to the door</text><text x="240" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Information goes in first. The brain works on it.</text><text x="240" y="326" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Then the body responds. It only goes one way.</text></svg>
