<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 368" role="img" aria-labelledby="d-31-tape-t d-31-tape-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-31-tape-t">Dot tape: steady speed or slowing</title><desc id="d-31-tape-d">Two dot tapes, each showing a ball position every second from 0 to 4 seconds. Top, a model ball with no friction: the dots are equally far apart, so the speed is steady. Bottom, a real ball on a floor: the gaps between dots get smaller each second, so the ball is slowing down, and friction pushes against the motion. Close dots mean slow and far apart dots mean fast.</desc><rect x="0" y="0" width="480" height="368" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Dot tape: steady speed or slowing</text><text x="24" y="72" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Model ball, no friction</text><text x="456" y="72" text-anchor="end" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">equal gaps = steady speed</text><line x1="24" x2="456" y1="110" y2="110" stroke="var(--line, #D0D8E8)" stroke-width="2"/><circle cx="40" cy="110" r="8" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="40" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">0 s</text><circle cx="130" cy="110" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="130" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">1 s</text><circle cx="220" cy="110" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="220" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">2 s</text><circle cx="310" cy="110" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="310" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">3 s</text><circle cx="400" cy="110" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="400" y="140" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">4 s</text><line x1="52" y1="92" x2="397.9" y2="92" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="406,92 397.9,96.95 397.9,87.05" fill="var(--muted, #47506E)"/><line x1="20" x2="460" y1="168" y2="168" stroke="var(--line, #D0D8E8)"/><text x="24" y="208" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Real ball on a floor</text><text x="456" y="208" text-anchor="end" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">gaps shrink = slowing down</text><line x1="24" x2="456" y1="246" y2="246" stroke="var(--line, #D0D8E8)" stroke-width="2"/><circle cx="40" cy="246" r="8" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="40" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">0 s</text><circle cx="150" cy="246" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="150" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">1 s</text><circle cx="235" cy="246" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="235" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">2 s</text><circle cx="295" cy="246" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="295" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">3 s</text><circle cx="335" cy="246" r="8" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="335" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">4 s</text><line x1="52" y1="228" x2="332.9" y2="228" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="341,228 332.9,232.95 332.9,223.05" fill="var(--muted, #47506E)"/><line x1="347" y1="296" x2="304" y2="296" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="295,296 304,290.5 304,301.5" fill="var(--absorb, #D6450B)"/><text x="355" y="301" text-anchor="start" font-size="12.5" font-weight="700" fill="var(--absorb, #D6450B)">friction</text><text x="240" y="330" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Close dots mean slow. Far dots mean fast.</text><text x="240" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Friction pushes against the motion, so the real gaps get smaller.</text></svg>
