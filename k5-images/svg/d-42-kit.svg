<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 324" role="img" aria-labelledby="d-42-kit-t d-42-kit-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-42-kit-t">A light-up card with a switch</title><desc id="d-42-kit-d">Top view of an index card with a coin cell on the left, an LED in the middle and a paper clip switch on the right. Strips of copper tape connect them in one loop: from the plus side of the cell to the LED long leg, from the LED short leg to the first brass fastener, then through the paper clip to the second fastener and back along the bottom to the cell. When the clip touches both fasteners the loop is complete and the LED lights. When the clip is swung away the loop is open and the LED is off. The LED lights only when its long leg is toward the plus side of the cell.</desc><rect x="0" y="0" width="480" height="324" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A light-up card with a switch</text><rect x="24" y="46" width="432" height="214" rx="10" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M100 124 V96 H247 V146" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M263 146 V120 H350 V170" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M410 170 V236 H100 V196" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><circle cx="100" cy="160" r="36" fill="#B8BCC8" stroke="var(--ink, #12172B)" stroke-width="3"/><circle cx="100" cy="160" r="24" fill="#D7DAE3" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="100" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink, #12172B)">+</text><text x="100" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">coin cell</text><text x="100" y="78" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">+ side up</text><circle cx="255" cy="160" r="15" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><line x1="247" y1="146" x2="247" y2="152" stroke="var(--ink, #12172B)" stroke-width="3"/><line x1="263" y1="146" x2="263" y2="152" stroke="var(--ink, #12172B)" stroke-width="3"/><line x1="275" y1="160" x2="283" y2="160" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="269.14213562373095" y1="174.14213562373095" x2="274.7989898732233" y2="179.79898987322332" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="180" x2="255" y2="188" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="240.85786437626905" y1="174.14213562373095" x2="235.20101012677668" y2="179.79898987322332" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="235" y1="160" x2="227" y2="160" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="240.85786437626905" y1="145.85786437626905" x2="235.20101012677668" y2="140.20101012677668" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="140" x2="255" y2="132" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="269.14213562373095" y1="145.85786437626905" x2="274.7989898732233" y2="140.20101012677668" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><text x="255" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">LED</text><text x="232" y="226" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">(long leg toward +)</text><rect x="342" y="162" width="76" height="16" rx="8" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="348" y="167" width="64" height="6" rx="3" fill="none" stroke="var(--ink, #12172B)" stroke-width="2"/><g transform="rotate(-38 350 170)" opacity=".55"><rect x="342" y="162" width="76" height="16" rx="8" fill="none" stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-dasharray="5 4"/></g><circle cx="350" cy="170" r="8" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="410" cy="170" r="8" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="396" y="204" text-anchor="end" font-size="13" font-weight="700" fill="var(--ink, #12172B)">paper clip switch</text><text x="396" y="220" text-anchor="end" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">dashed clip = open</text><text x="240" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">copper tape carries the current around the card</text><text x="240" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Close the switch and the loop is complete: the LED lights.</text><text x="240" y="304" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">The LED works one way only: long leg toward the + side of the cell.</text></svg>
