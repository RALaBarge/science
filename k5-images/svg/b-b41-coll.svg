<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="b41-coll-t b41-coll-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b41-coll-t">A collision passes energy along</title><desc id="b41-coll-d">Two pictures. Before: a marble with an arrow moves toward a block that is not moving. After: the marble has stopped or slowed and the block moves away with an arrow. The energy of motion moved from the marble to the block.</desc><rect x="0" y="0" width="480" height="290" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A collision passes energy along</text><text x="240" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Before</text><circle cx="90" cy="100" r="16" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="112" y1="100" x2="197.4" y2="100.0" stroke="var(--absorb, #D6450B)" stroke-width="5" stroke-linecap="round"/><polygon points="210,100 197.4,107.7 197.4,92.3" fill="var(--absorb, #D6450B)"/><text x="160" y="86" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">moving</text><rect x="260" y="78" width="44" height="44" rx="4" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="282" y="144" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">block at rest</text><line x1="20" y1="170" x2="460" y2="170" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><text x="240" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">After</text><circle cx="210" cy="240" r="16" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="210" y="276" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">marble slows</text><rect x="262" y="218" width="44" height="44" rx="4" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="316" y1="240" x2="407.4" y2="240.0" stroke="var(--absorb, #D6450B)" stroke-width="5" stroke-linecap="round"/><polygon points="420,240 407.4,247.7 407.4,232.3" fill="var(--absorb, #D6450B)"/><text x="370" y="226" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">moves!</text><g stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-linecap="round"><line x1="238" y1="222" x2="246" y2="214"/><line x1="242" y1="232" x2="254" y2="230"/></g></svg>