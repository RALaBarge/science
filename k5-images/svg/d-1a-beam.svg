<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 396" role="img" aria-labelledby="d-1a-beam-t d-1a-beam-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-1a-beam-t">Four materials in a light beam</title><desc id="d-1a-beam-d">Four rows. In each, a flashlight on the left sends a beam to a material. Clear plastic: the light passes straight through. Wax paper: some light passes through and spreads out, so it is blurry. Cardboard: the light is blocked and there is a shadow behind it. Foil: the light bounces back toward the flashlight.</desc><rect x="0" y="0" width="480" height="396" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Four materials in a light beam</text><rect x="14" y="83" width="34" height="18" rx="4" fill="var(--muted, #47506E)"/><polygon points="48,83 58,78 58,106 48,101" fill="var(--muted, #47506E)"/><line x1="60" y1="92" x2="175.2" y2="92" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="186,92 175.2,98.6 175.2,85.4" fill="var(--beam, #F2A900)"/><rect x="190" y="62" width="14" height="60" rx="3" fill="var(--reflect, #2B66E8)" opacity="0.25" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="206" y1="92" x2="285.2" y2="92" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="296,92 285.2,98.6 285.2,85.4" fill="var(--beam, #F2A900)"/><text x="312" y="88" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Clear plastic</text><text x="312" y="106" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">light passes through</text><rect x="14" y="167" width="34" height="18" rx="4" fill="var(--muted, #47506E)"/><polygon points="48,167 58,162 58,190 48,185" fill="var(--muted, #47506E)"/><line x1="60" y1="176" x2="175.2" y2="176" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="186,176 175.2,182.6 175.2,169.4" fill="var(--beam, #F2A900)"/><rect x="190" y="146" width="14" height="60" rx="3" fill="var(--beam, #F2A900)" opacity="0.55" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="206" y1="176" x2="285.0246205277615" y2="155.78439939987496" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="292,154 286.1150868276851,160.04713129957625 283.9341542278379,151.52166750017366" fill="var(--beam, #F2A900)"/><line x1="206" y1="176" x2="284.8" y2="176" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="292,176 284.8,180.4 284.8,171.6" fill="var(--beam, #F2A900)"/><line x1="206" y1="176" x2="285.0246205277615" y2="196.21560060012504" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="292,198 283.9341542278379,200.47833249982634 286.1150868276851,191.95286870042375" fill="var(--beam, #F2A900)"/><text x="312" y="172" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Wax paper</text><text x="312" y="190" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">some light passes, blurry</text><rect x="14" y="251" width="34" height="18" rx="4" fill="var(--muted, #47506E)"/><polygon points="48,251 58,246 58,274 48,269" fill="var(--muted, #47506E)"/><line x1="60" y1="260" x2="175.2" y2="260" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="186,260 175.2,266.6 175.2,253.4" fill="var(--beam, #F2A900)"/><rect x="190" y="230" width="14" height="60" rx="3" fill="var(--absorb, #D6450B)" opacity="1" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="208" y="230" width="88" height="60" rx="4" fill="var(--shade, #222A4A)" opacity=".3"/><text x="252" y="265" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">shadow</text><text x="312" y="256" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Cardboard</text><text x="312" y="274" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">blocks the light</text><rect x="14" y="335" width="34" height="18" rx="4" fill="var(--muted, #47506E)"/><polygon points="48,335 58,330 58,358 48,353" fill="var(--muted, #47506E)"/><line x1="60" y1="338" x2="175.2" y2="338" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="186,338 175.2,344.6 175.2,331.4" fill="var(--beam, #F2A900)"/><rect x="190" y="314" width="14" height="60" rx="3" fill="var(--surface, #fff)" opacity="1" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="186" y1="352" x2="106.8" y2="352" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="96,352 106.8,345.4 106.8,358.6" fill="var(--beam, #F2A900)"/><text x="312" y="340" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Foil</text><text x="312" y="358" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">bounces light back</text></svg>
