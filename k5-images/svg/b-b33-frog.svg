<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 358" role="img" aria-labelledby="b33-frog-t b33-frog-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b33-frog-t">Frog life cycle</title><desc id="b33-frog-d">A circle of four boxes joined by arrows: 1 egg in the water, 2 tadpole with a tail and no legs, 3 froglet that grows legs, 4 adult frog that lays new eggs. The arrows go around and back to the egg.</desc><rect x="0" y="0" width="480" height="358" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Frog life cycle</text><rect x="48" y="58" width="124" height="74" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="110" y="78" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">1 Egg</text><text x="110" y="98" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">in the water</text><ellipse cx="110" cy="116" rx="9" ry="7" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="308" y="58" width="124" height="74" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="370" y="78" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">2 Tadpole</text><text x="370" y="98" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">has a tail, no legs</text><ellipse cx="364" cy="116" rx="12" ry="7" fill="var(--transmit, #0B7F70)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M376 116 q14 -6 22 2" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="308" y="218" width="124" height="74" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="370" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">3 Froglet</text><text x="370" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">grows legs</text><ellipse cx="366" cy="278" rx="12" ry="8" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M356 284 l-8 8 M376 284 l8 8 M378 274 q14 -2 20 4" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="218" width="124" height="74" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="110" y="238" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">4 Adult frog</text><text x="110" y="258" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">lays new eggs</text><ellipse cx="110" cy="278" rx="18" ry="10" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="122" cy="270" r="3" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><path d="M96 284 l-8 8 M126 284 l8 8" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="174" y1="90" x2="294.3" y2="90.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="306,90 294.3,97.2 294.3,82.8" fill="var(--transmit, #0B7F70)"/><line x1="370" y1="126" x2="370.0" y2="204.3" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="370,216 362.9,204.3 377.1,204.3" fill="var(--transmit, #0B7F70)"/><line x1="306" y1="250" x2="185.7" y2="250.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="174,250 185.7,242.8 185.7,257.1" fill="var(--transmit, #0B7F70)"/><line x1="110" y1="216" x2="110.0" y2="137.7" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="110,126 117.2,137.7 102.8,137.7" fill="var(--transmit, #0B7F70)"/><text x="240" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">A cycle:</text><text x="240" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">the adults</text><text x="240" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">start it again.</text><text x="240" y="340" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Every life cycle begins, grows, reproduces and ends.</text></svg>