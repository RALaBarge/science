<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="b52-flash-t b52-flash-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b52-flash-t">Closer looks brighter</title><desc id="b52-flash-d">Two pictures of the same flashlight pointed at a card. Close up, five bright arrows reach the card, so it looks bright. Far away, the light is spread over a larger area, so the card looks dim.</desc><rect x="0" y="0" width="480" height="280" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Closer looks brighter</text><rect x="14" y="50" width="210" height="210" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><rect x="256" y="50" width="210" height="210" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="119" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Flashlight close</text><rect x="24" y="130" width="30" height="26" rx="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="190" y="100" width="10" height="86" rx="0" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="58" y1="137.35" x2="178.9" y2="113.4" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><polygon points="186,112 179.8,117.7 178.1,109.1" fill="var(--beam, #F2A900)"/><line x1="58" y1="139.75" x2="178.8" y2="128.7" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><polygon points="186,128 179.2,133.0 178.4,124.3" fill="var(--beam, #F2A900)"/><line x1="58" y1="142" x2="178.8" y2="142.9" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><polygon points="186,143 178.8,147.3 178.8,138.5" fill="var(--beam, #F2A900)"/><line x1="58" y1="144.25" x2="178.8" y2="157.2" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><polygon points="186,158 178.4,161.6 179.3,152.9" fill="var(--beam, #F2A900)"/><line x1="58" y1="146.65" x2="179.0" y2="172.5" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><polygon points="186,174 178.0,176.8 179.9,168.2" fill="var(--beam, #F2A900)"/><text x="119" y="222" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">bright: the card catches</text><text x="119" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">lots of light</text><text x="361" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Flashlight far</text><rect x="266" y="130" width="30" height="26" rx="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="432" y="100" width="10" height="86" rx="0" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="300" y1="137.35" x2="422.7" y2="113.0" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-linecap="round" /><polygon points="428,112 423.3,116.3 422.1,109.8" fill="var(--beam, #F2A900)"/><line x1="300" y1="139.75" x2="422.6" y2="128.5" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-linecap="round" /><polygon points="428,128 422.9,131.8 422.3,125.2" fill="var(--beam, #F2A900)"/><line x1="300" y1="142" x2="422.6" y2="143.0" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-linecap="round" /><polygon points="428,143 422.6,146.3 422.6,139.7" fill="var(--beam, #F2A900)"/><line x1="300" y1="144.25" x2="422.6" y2="157.4" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-linecap="round" /><polygon points="428,158 422.3,160.7 423.0,154.1" fill="var(--beam, #F2A900)"/><line x1="300" y1="146.65" x2="422.7" y2="172.9" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-linecap="round" /><polygon points="428,174 422.0,176.1 423.4,169.6" fill="var(--beam, #F2A900)"/><text x="361" y="222" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">dim: the same light is</text><text x="361" y="240" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">spread out over a bigger area</text></svg>