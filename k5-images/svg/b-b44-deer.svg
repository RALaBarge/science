<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 214" role="img" aria-labelledby="b44-deer-t b44-deer-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b44-deer-t">Hear, think, run</title><desc id="b44-deer-d">A deer with ears up on the left. An arrow goes from the ear to a brain, then another arrow to the legs. A label says the ear hears a sound, the brain says danger, and the legs run.</desc><rect x="0" y="0" width="480" height="214" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Hear, think, run</text><ellipse cx="90" cy="150" rx="46" ry="22" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M126 138 l14 -30 h10 l-6 30" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 168 v34 M110 168 v34" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="144" y1="98" x2="204.2" y2="89.4" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="214,88 205.1,95.4 203.3,83.4" fill="var(--transmit, #0B7F70)"/><text x="180" y="76" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">hears a sound</text><circle cx="246" cy="90" r="24" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><text x="246" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">brain</text><text x="246" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="var(--red, #D93036)">&quot;danger!&quot;</text><line x1="270" y1="100" x2="322.4" y2="143.7" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="330,150 318.5,148.3 326.3,139.0" fill="var(--transmit, #0B7F70)"/><text x="400" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">legs run</text><line x1="340" y1="170" x2="429.2" y2="170.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="440,170 429.2,176.6 429.2,163.4" fill="var(--absorb, #D6450B)"/></svg>