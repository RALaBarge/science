<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 256" role="img" aria-labelledby="b41-sled-t b41-sled-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b41-sled-t">A faster sled pushes farther</title><desc id="b41-sled-d">A snowy hill with two sleds. The sled that started higher is going fast and has a long arrow, and it pushes a long way into the snow. The sled that started lower is slow, has a short arrow, and stops sooner.</desc><rect x="0" y="0" width="480" height="256" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A faster sled pushes farther</text><polygon points="0,240 0,70 300,200 480,200 480,240" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="2" stroke-linejoin="round"/><path d="M0 70 L300 200 L480 200" fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(112 112) rotate(23)"><rect x="-18" y="-7" width="36" height="14" rx="4" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="2"/></g><text x="110" y="84" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">start high</text><line x1="130" y1="108" x2="190.2" y2="135.5" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="200,140 187.4,141.5 192.9,129.5" fill="var(--absorb, #D6450B)"/><g transform="translate(42 82) rotate(23)"><rect x="-18" y="-7" width="36" height="14" rx="4" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/></g><text x="42" y="56" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">start low</text><line x1="62" y1="86" x2="92.5" y2="98.9" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round"/><polygon points="100,102 90.6,103.4 94.5,94.3" fill="var(--reflect, #2B66E8)"/><line x1="310" y1="192" x2="450" y2="192" stroke="var(--absorb, #D6450B)" stroke-width="6" stroke-linecap="round"/><text x="380" y="220" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--absorb, #D6450B)">pushes far</text><line x1="310" y1="198" x2="350" y2="198" stroke="var(--reflect, #2B66E8)" stroke-width="6" stroke-linecap="round"/><text x="240" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Higher start: faster at the bottom, longer push.</text></svg>