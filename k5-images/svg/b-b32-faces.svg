<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 352" role="img" aria-labelledby="b32-faces-t b32-faces-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b32-faces-t">Weather and climate</title><desc id="b32-faces-d">Two faces. On the left, a face under a rain cloud for weather: what it is like today, which can change in a day. On the right, a smiling face under the Sun for climate: what a place is usually like over many years.</desc><rect x="0" y="0" width="480" height="352" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Weather and climate</text><rect x="16" y="44" width="214" height="290" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><rect x="250" y="44" width="214" height="290" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="123" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink, #12172B)">Weather</text><text x="123" y="92" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">like your mood today</text><g transform="translate(0 40)"><circle cx="123" cy="150" r="52" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3"/><circle cx="105" cy="140" r="5" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><circle cx="141" cy="140" r="5" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><path d="M103 176 Q123 160 143 176" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 100 q-14 0 -14 -12 q0 -12 14 -12 q4 -12 20 -10 q14 -8 26 4 q16 0 16 14 q0 16 -14 16z" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="100" y1="108" x2="96" y2="118" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round"/><line x1="118" y1="108" x2="114" y2="118" stro