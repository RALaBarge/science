<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 284" role="img" aria-labelledby="b52-orion-t b52-orion-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b52-orion-t">Find Orion</title><desc id="b52-orion-d">A dark night sky with four bright stars at the corners and three stars in a short row in the middle. The row is labeled Orion's belt.</desc><rect x="0" y="0" width="480" height="284" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Find Orion</text><rect x="0" y="40" width="480" height="200" rx="0" fill="var(--shade, #222A4A)" stroke="var(--shade, #222A4A)" stroke-width="0"/><circle cx="120" cy="70" r="5" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="330" cy="70" r="6.5" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="160" cy="190" r="5" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="320" cy="190" r="7" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="210" cy="130" r="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="240" cy="126" r="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><circle cx="270" cy="122" r="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1"/><line x1="210" y1="130" x2="240" y2="126" stroke="var(--beam, #F2A900)" stroke-width="1.5" stroke-linecap="round"/><line x1="240" y1="126" x2="270" y2="122" stroke="var(--beam, #F2A900)" stroke-width="1.5" stroke-linecap="round"/><line x1="120" y1="70" x2="210" y2="130" stroke="var(--muted, #47506E)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="330" y1="70" x2="270" y2="122" stroke="var(--muted, #47506E)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="160" y1="190" x2="210" y2="130" stroke="var(--muted, #47506E)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="320" y1="190" x2="270" y2="122" stroke="var(--muted, #47506E)" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="240" y="112" text-anchor="middle" font-size="12" font-weight="400" fill="#fff">Orion's belt</text><text x="240" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Three stars in a row make Orion's belt. Look south in winter evenings.</text></svg>