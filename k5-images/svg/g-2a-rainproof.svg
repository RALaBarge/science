<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="g-2a-rainproof-t g-2a-rainproof-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-2a-rainproof-t">Rainproof Note: did the paper stay dry?</title><desc id="g-2a-rainproof-d">Table drawn with colored dots. Plastic wrap: dry, dry, dry. Foil: dry, dry, dry. Cloth: damp, wet, wet. Paper: wet, wet, wet.</desc><rect x="0" y="0" width="480" height="270" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Rainproof Note: did the paper stay dry?</text><text x="202.33333333333334" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Try 1</text><text x="307" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Try 2</text><text x="411.6666666666667" y="62" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Try 3</text><line x1="12" x2="468" y1="74" y2="74" stroke="var(--line, #D0D8E8)"/><text x="18" y="101" font-size="14" fill="var(--ink, #12172B)">Plastic wrap</text><circle cx="202.33333333333334" cy="96" r="16" fill="var(--transmit,#0B7F70)" stroke="var(--transmit,#0B7F70)" stroke-width="2"/><text x="202.33333333333334" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--on-color,#fff)">dry</text><circle cx="307" cy="96" r="16" fill="var(--transmit,#0B7F70)" stroke="var(--transmit,#0B7F70)" stroke-width="2"/><text x="307" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--on-color,#fff)">dry</text><circle cx="411.6666666666667" cy="96" r="16" fill="var(--transmit,#0B7F70)" stroke="var(--transmit,#0B7F70)" stroke-width="2"/><text x="411.6666666666667" y="101" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--on-color,#fff)">dry</text><line x1="12" x2="468" y1="118" y2="118" stroke="var(--line, #D0D8E8)"/>