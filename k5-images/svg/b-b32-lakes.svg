<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 392" role="img" aria-labelledby="b32-lakes-t b32-lakes-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b32-lakes-t">The Great Lakes shape Michigan weather</title><desc id="b32-lakes-d">A rough drawing of Michigan: Lake Superior and Lake Huron in blue, the Lower Peninsula in green, and an arrow of cold air blowing over the lake toward the land. Text says big lakes warm and cool slowly so shore towns are milder, and cold air over warmer lake water makes lake-effect snow.</desc><rect x="0" y="0" width="480" height="392" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">The Great Lakes shape Michigan weather</text><path d="M120 70 Q200 30 300 90 Q330 130 300 170 Q260 130 220 150 Q170 120 120 70Z" fill="var(--reflect, #2B66E8)" fill-opacity=".35" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 130 Q400 150 390 220 Q350 240 330 200Z" fill="var(--reflect, #2B66E8)" fill-opacity=".35" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 170 Q250 160 275 190 Q290 250 260 300 Q215 300 205 240 Q200 200 215 170Z" fill="var(--green, #25904F)" fill-opacity=".3" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="215" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Lake Superior</text><text x="366" y="190" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Lake</text><text x="366" y="205" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Huron</text><text x="240" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Lower</text><text x="240" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Peninsula</text><line x1="70" y1="260" x2="180.2" y2="241.6" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round"/><polygon points="190,240 181.2,247.6 179.2,235.7" fill="var(--reflect, #2B66E8)"/><text x="70" y="285" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">Cold air blows over</text><text x="70" y="300" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">the warmer lake in fall:</text><text x="70" y="320" text-anchor="start" font-size="13" font-weight="700" fill="var(--reflect, #2B66E8)">lake-effect snow</text><text x="240" y="352" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Big lakes warm up and cool off slowly,</text><text x="240" y="370" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">so shore towns are milder.</text></svg>