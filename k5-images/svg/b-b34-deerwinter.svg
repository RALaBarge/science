<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 244" role="img" aria-labelledby="b34-deerwinter-t b34-deerwinter-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b34-deerwinter-t">Deer in winter</title><desc id="b34-deerwinter-d">Two drawn deer on a snowy hill. The left deer has a thick, heavy coat and stays warm. The right deer has a thinner coat and loses heat faster.</desc><rect x="0" y="0" width="480" height="244" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Deer in winter</text><rect x="0" y="40" width="480" height="150" fill="var(--surface-2, #E8EDF6)"/><path d="M0 150 Q120 110 240 140 T480 130 V190 H0Z" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)" stroke-width="2"/><g transform="translate(110 110) scale(1.6)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3.5" /><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v14 M10 8 v14" stroke="var(--ink, #12172B)" stroke-width="2.5"/></g><g transform="translate(330 120) scale(1.6)"><ellipse cx="0" cy="0" rx="20" ry="11" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5" stroke-dasharray="3 2"/><path d="M14 -6 l8 -14 h8 l-4 14" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M-12 8 v14 M10 8 v14" stroke="var(--ink, #12172B)" stroke-width="2.5"/></g><text x="110" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">thick fur: warm</text><text x="330" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">thin fur: loses heat faster</text><text x="240" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Fur color and thickness can help deer in winter.</text></svg>