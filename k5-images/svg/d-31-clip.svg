<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 296" role="img" aria-labelledby="d-31-clip-t d-31-clip-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-31-clip-t">Paper-clip mover kit (side view)</title><desc id="d-31-clip-d">Side view. A cardboard sheet rests like a bridge on two stacks of books. A paper clip sits on top of the cardboard at the start line. A magnet is held under the cardboard and moved along, and the clip follows it toward the finish line, at least 20 centimeters away. Nobody touches the clip.</desc><rect x="0" y="0" width="480" height="296" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Paper-clip mover kit (side view)</text><rect x="50" y="170" width="70" height="56" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="360" y="170" width="70" height="56" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="85" y="204" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">books</text><text x="395" y="204" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">books</text><rect x="40" y="158" width="400" height="12" rx="3" fill="#C8A46E" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="124" y="142" width="30" height="12" rx="6" fill="none" stroke="var(--ink, #12172B)" stroke-width="2.5"/><rect x="130" y="145" width="18" height="6" rx="3" fill="none" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="139" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">paper clip</text><line x1="166" y1="148" x2="280.1" y2="148" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round"/><polygon points="290,148 280.1,154.05 280.1,141.95" fill="var(--reflect, #2B66E8)"/><text x="228" y="134" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--reflect, #2B66E8)">clip moves</text><path d="M126 176 h28 v18 h-8 v-10 h-12 v10 h-8z" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="160" y1="212" x2="280.1" y2="212" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="290,212 280.1,218.05 280.1,205.95" fill="var(--absorb, #D6450B)"/><text x="225" y="232" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--absorb, #D6450B)">move the magnet under the card</text><text x="139" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">magnet</text><text x="400" y="152" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">cardboard bridge</text><line x1="139" x2="139" y1="72" y2="140" stroke="var(--muted, #47506E)" stroke-dasharray="4 3"/><line x1="339" x2="339" y1="72" y2="150" stroke="var(--muted, #47506E)" stroke-dasharray="4 3"/><line x1="144" y1="98" x2="325.9" y2="98" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="334,98 325.9,102.95 325.9,93.05" fill="var(--muted, #47506E)"/><line x1="334" y1="98" x2="152.1" y2="98" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="144,98 152.1,93.05 152.1,102.95" fill="var(--muted, #47506E)"/><text x="240" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">at least 20 cm</text><text x="139" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">start</text><text x="339" y="62" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">finish</text><text x="240" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">Only the magnet is touched. The clip is moved through the card.</text></svg>
