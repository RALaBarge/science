<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 356" role="img" aria-labelledby="d-52-shadow-t d-52-shadow-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-52-shadow-t">Shadow of a stick through the day (top view)</title><desc id="d-52-shadow-d">Top view of a 10 centimeter stick with five shadow arrows to scale. 8:30 am: 34 cm pointing west. 10:00 am: 20 cm northwest. 12:00 pm: 9 cm north, the shortest. 2:00 pm: 18 cm northeast. 3:30 pm: 30 cm pointing east. The shadow points away from the Sun, which is in the south at noon, and is longest when the Sun is low.</desc><rect x="0" y="0" width="480" height="356" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Shadow of a stick through the day (top view)</text><line x1="30" x2="450" y1="266" y2="266" stroke="var(--line, #D0D8E8)" stroke-dasharray="4 4"/><line x1="240" x2="240" y1="92" y2="266" stroke="var(--line, #D0D8E8)" stroke-dasharray="4 4"/><text x="18" y="271" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">W</text><text x="462" y="271" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink, #12172B)">E</text><text x="240" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">N</text><line x1="240" y1="266" x2="96" y2="266" stroke="var(--shade, #222A4A)" stroke-width="4" stroke-linecap="round"/><polygon points="87,266 96,260.5 96,271.5" fill="var(--shade, #222A4A)"/><text x="87" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">8:30 am</text><text x="87" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">34 cm</text><line x1="240" y1="266" x2="182.72435072388964" y2="208.72435072388964" stroke="var(--shade, #222A4A)" stroke-width="4" stroke-linecap="round"/><polygon points="176.36038969321072,202.36038969321072 186.61343802041566,204.83526342736363 178.83526342736363,212.61343802041566" fill="var(--shade, #222A4A)"/><text x="154.36038969321072" y="174.36038969321072" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">10:00 am</text><text x="154.36038969321072" y="188.36038969321072" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">20 cm</text><line x1="240" y1="266" x2="240" y2="234.5" stroke="var(--shade, #222A4A)" stroke-width="4" stroke-linecap="round"/><polygon points="240,225.5 245.5,234.5 234.5,234.5" fill="var(--shade, #222A4A)"/><text x="240" y="191.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">12:00 pm</text><text x="240" y="205.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">9 cm</text><line x1="240" y1="266" x2="290.91168824543144" y2="215.08831175456856" stroke="var(--shade, #222A4A)" stroke-width="4" stroke-linecap="round"/><polygon points="297.27564927611036,208.72435072388964 294.8007755419574,218.97739905109458 287.02260094890545,211.19922445804255" fill="var(--shade, #222A4A)"/><text x="319.27564927611036" y="180.72435072388964" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">2:00 pm</text><text x="319.27564927611036" y="194.72435072388964" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">18 cm</text><line x1="240" y1="266" x2="366" y2="265.99999999999994" stroke="var(--shade, #222A4A)" stroke-width="4" stroke-linecap="round"/><polygon points="375,265.99999999999994 366,271.49999999999994 366,260.49999999999994" fill="var(--shade, #222A4A)"/><text x="375" y="229.99999999999994" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">3:30 pm</text><text x="375" y="243.99999999999994" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">30 cm</text><circle cx="240" cy="266" r="6" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><text x="240" y="290" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">10 cm stick (top view)</text><text x="240" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">The Sun is in the south at noon, so the shortest shadow points north.</text><text x="240" y="340" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">Shadows point away from the Sun and change length all day. Drawn to scale.</text></svg>
