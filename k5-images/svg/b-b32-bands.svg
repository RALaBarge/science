<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 336" role="img" aria-labelledby="b32-bands-t b32-bands-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b32-bands-t">Climate bands on Earth</title><desc id="b32-bands-d">A globe shown as a circle with five bands. A hot band across the middle at the equator, mild bands on either side, and cold bands near the top and bottom poles. Labels say the Sun is low near the poles and high near the equator.</desc><rect x="0" y="0" width="480" height="336" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Climate bands on Earth</text><circle cx="170" cy="180" r="118" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="3"/><clipPath id="b32-bands-c"><circle cx="170" cy="180" r="117"/></clipPath><g clip-path="url(#b32-bands-c)"><rect x="50" y="62" width="240" height="40" fill="var(--reflect, #2B66E8)" opacity=".35"/><rect x="50" y="102" width="240" height="40" fill="var(--green, #25904F)" opacity=".35"/><rect x="50" y="142" width="240" height="76" fill="var(--absorb, #D6450B)" opacity=".35"/><rect x="50" y="218" width="240" height="40" fill="var(--green, #25904F)" opacity=".35"/><rect x="50" y="258" width="240" height="42" fill="var(--reflect, #2B66E8)" opacity=".35"/></g><line x1="52" y1="180" x2="288" y2="180" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="170" y="176" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">equator</text><text x="170" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">cold</text><text x="170" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">mild</text><text x="170" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">hot</text><text x="170" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">mild</text><text x="170" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">cold</text><text x="390" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="var(--reflect, #2B66E8)">Near the poles</text><text x="390" y="114" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">the Sun is low,</text><text x="390" y="131" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">so it is colder.</text><text x="390" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="var(--absorb, #D6450B)">Near the equator</text><text x="390" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">the Sun is high,</text><text x="390" y="231" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">so it is warmer.</text><text x="390" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="var(--green, #25904F)">Michigan is in</text><text x="390" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="var(--green, #25904F)">the mild band</text><text x="390" y="314" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">with four seasons.</text></svg>