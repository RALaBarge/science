<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="b43-mirror-t b43-mirror-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b43-mirror-t">Light bounces off a mirror</title><desc id="b43-mirror-d">A flashlight on the left sends a beam down to a mirror lying flat. The beam bounces off and goes up to the right. A dashed line stands straight up from the mirror; the beam comes in at the same angle on one side as it leaves on the other.</desc><rect x="0" y="0" width="480" height="290" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Light bounces off a mirror</text><rect x="100" y="220" width="280" height="10" rx="3" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="240" y="252" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">mirror</text><line x1="240" y1="80" x2="240" y2="218" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="240" y="72" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">straight up</text><rect x="46" y="80" width="44" height="22" rx="4" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="68" y="70" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">flashlight</text><line x1="92" y1="102" x2="226.2" y2="210.1" stroke="var(--beam, #F2A900)" stroke-width="5" stroke-linecap="round"/><polygon points="236,218 221.4,216.1 231.0,204.1" fill="var(--beam, #F2A900)"/><line x1="244" y1="218" x2="380.2" y2="107.9" stroke="var(--beam, #F2A900)" stroke-width="5" stroke-linecap="round"/><polygon points="390,100 385.0,113.9 375.4,101.9" fill="var(--beam, #F2A900)"/><text x="150" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">in</text><text x="340" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">out</text></svg>