<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="b52-moon-t b52-moon-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b52-moon-t">Moon phases</title><desc id="b52-moon-d">Looking down on Earth in the middle with the Sun on the left shining rays. The Moon is drawn at four spots on a dashed circle around Earth: new on the Sun side, half on the bottom, full on the far side, half on top. The Sun always lights half of the Moon; what changes is how much of the lit half faces Earth.</desc><rect x="0" y="0" width="480" height="300" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Moon phases</text><line x1="77.0" y1="150.0" x2="86.0" y2="150.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="73.7" y1="162.5" x2="81.4" y2="167.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="64.5" y1="171.7" x2="69.0" y2="179.4" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="52.0" y1="175.0" x2="52.0" y2="184.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="39.5" y1="171.7" x2="35.0" y2="179.4" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="30.3" y1="162.5" x2="22.6" y2="167.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="27.0" y1="150.0" x2="18.0" y2="150.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="30.3" y1="137.5" x2="22.6" y2="133.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="39.5" y1="128.3" x2="35.0" y2="120.6" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="52.0" y1="125.0" x2="52.0" y2="116.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="64.5" y1="128.3" x2="69.0" y2="120.6" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="73.7" y1="137.5" x2="81.4" y2="133.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><circle cx="52" cy="150" r="20" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="52" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #12172B)">Sun</text><line x1="84" y1="120" x2="102.8" y2="120.0" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="110,120 102.8,124.4 102.8,115.6" fill="var(--beam, #F2A900)"/><line x1="84" y1="150" x2="102.8" y2="150.0" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="110,150 102.8,154.4 102.8,145.6" fill="var(--beam, #F2A900)"/><line x1="84" y1="180" x2="102.8" y2="180.0" stroke="var(--beam, #F2A900)" stroke-width="2" stroke-linecap="round"/><polygon points="110,180 102.8,184.4 102.8,175.6" fill="var(--beam, #F2A900)"/><circle cx="250" cy="150" r="22" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="250" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Earth</text><ellipse cx="250" cy="150" rx="100" ry="100" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="150" cy="150" r="11" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M150 139 A11 11 0 0 0 150 161Z" fill="var(--beam, #F2A900)"/><text x="150" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink, #12172B)">new</text><circle cx="250" cy="250" r="11" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M250 239 A11 11 0 0 0 250 261Z" fill="var(--beam, #F2A900)"/><text x="250" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink, #12172B)">half (first quarter)</text><circle cx="350" cy="150" r="11" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M350 139 A11 11 0 0 0 350 161Z" fill="var(--beam, #F2A900)"/><text x="350" y="128" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink, #12172B)">full</text><circle cx="250" cy="50" r="11" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><path d="M250 39 A11 11 0 0 0 250 61Z" fill="var(--beam, #F2A900)"/><text x="268" y="54" text-anchor="start" font-size="11.5" font-weight="700" fill="var(--ink, #12172B)">half (third quarter)</text><text x="372" y="150" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">Always half</text><text x="372" y="165" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">the Moon is lit.</text><text x="372" y="180" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">We see more or</text><text x="372" y="195" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">less of it.</text></svg>