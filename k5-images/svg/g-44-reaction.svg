<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" role="img" aria-labelledby="g-44-reaction-t g-44-reaction-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-44-reaction-t">Reaction distance (farther = slower)</title><desc id="g-44-reaction-d">Grouped bar graph of how far the ruler fell, in cm and inches. Sight: 12 cm (about 4.7 in), 10 cm (about 4 in), 9 cm (about 3.5 in). Sound cue: 14 cm (about 5.5 in), 12 cm (about 4.7 in), 13 cm (about 5 in). Farther means a slower reaction.</desc><defs><pattern id="g-44-reaction-p1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--absorb, #D6450B)"/><rect width="2.5" height="6" fill="rgba(255,255,255,.45)"/></pattern></defs><rect x="0" y="0" width="520" height="330" fill="var(--surface, #fff)"/><text x="260" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Reaction distance (farther = slower)</text><line x1="54" x2="464" y1="250" y2="250" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="255" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">0</text><line x1="54" x2="464" y1="203" y2="203" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="208" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">4</text><line x1="54" x2="464" y1="156" y2="156" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="161" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">8</text><line x1="54" x2="464" y1="109" y2="109" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="114" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">12</text><line x1="54" x2="464" y1="62" y2="62" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="67" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">16</text><text transform="translate(14 156) rotate(-90)" text-anchor="middle" font-size="11.5" fill="var(--muted, #47506E)">Distance the ruler fell (cm and inches)</text><rect x="70.03333333333333" y="109" width="51.3" height="141" rx="3" fill="var(--reflect, #2B66E8)" /><text x="95.68333333333334" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">12</text><rect x="123.33333333333333" y="85.5" width="51.3" height="164.5" rx="3" fill="url(#g-44-reaction-p1)" /><text x="148.98333333333332" y="79.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">14</text><text x="122.33333333333333" y="270" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Try 1</text><rect x="206.7" y="132.5" width="51.3" height="117.5" rx="3" fill="var(--reflect, #2B66E8)" /><text x="232.35" y="126.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">10</text><rect x="260" y="109" width="51.3" height="141" rx="3" fill="url(#g-44-reaction-p1)" /><text x="285.65" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">12</text><text x="259" y="270" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Try 2</text><rect x="343.3666666666667" y="144.25" width="51.3" height="105.75" rx="3" fill="var(--reflect, #2B66E8)" /><text x="369.01666666666665" y="138.25" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">9</text><rect x="396.6666666666667" y="97.25" width="51.3" height="152.75" rx="3" fill="url(#g-44-reaction-p1)" /><text x="422.31666666666666" y="91.25" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">13</text><text x="395.66666666666663" y="270" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Try 3</text><line x1="54" x2="464" y1="250" y2="250" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="54" y="305" width="14" height="14" rx="3" fill="var(--reflect, #2B66E8)"/><text x="74" y="317" font-size="13" fill="var(--ink, #12172B)">Sight</text><rect x="12