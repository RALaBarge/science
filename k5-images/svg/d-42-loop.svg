<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 396" role="img" aria-labelledby="d-42-loop-t d-42-loop-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-42-loop-t">A circuit is a closed loop</title><desc id="d-42-loop-d">Two circuits made of a battery, a bulb and wire. Top: the loop has a gap on the right, so the bulb is off. Bottom: the loop is complete, orange arrows show charges moving around the whole loop together, and the bulb glows with rays around it.</desc><rect x="0" y="0" width="480" height="396" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A circuit is a closed loop</text><g fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"><path d="M50 110 V84 H135"/><path d="M165 84 H250 V120"/><path d="M50 136 V174 H250"/><path d="M250 174 V148"/></g><line x1="32" x2="68" y1="110" y2="110" stroke="var(--ink, #12172B)" stroke-width="3"/><line x1="40" x2="60" y1="136" y2="136" stroke="var(--ink, #12172B)" stroke-width="6"/><text x="24" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">+</text><text x="94" y="128" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">battery</text><circle cx="150" cy="84" r="15" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M139 92 L145 80 L150 87 L155 80 L161 92" fill="none" stroke="var(--ink, #12172B)" stroke-width="1.8"/><text x="150" y="60" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">bulb</text><text x="260" y="138" text-anchor="start" font-size="13" font-weight="700" fill="var(--absorb, #D6450B)">gap</text><text x="292" y="108" text-anchor="start" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Open loop</text><text x="292" y="128" text-anchor="start" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">There is a gap, so</text><text x="292" y="144.47" text-anchor="start" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">the bulb stays off.</text><line x1="20" x2="460" y1="206" y2="206" stroke="var(--line, #D0D8E8)"/><g fill="none" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"><path d="M50 292 V266 H135"/><path d="M165 266 H250 V356"/><path d="M50 318 V356 H250"/></g><line x1="32" x2="68" y1="292" y2="292" stroke="var(--ink, #12172B)" stroke-width="3"/><line x1="40" x2="60" y1="318" y2="318" stroke="var(--ink, #12172B)" stroke-width="6"/><text x="24" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">+</text><text x="94" y="310" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">battery</text><line x1="169" y1="266" x2="180" y2="266" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="165.371322893124" y1="277.16791979355696" x2="174.27050983124843" y2="283.6335575687742" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="155.871322893124" y1="284.0700738096079" x2="159.27050983124843" y2="294.5316954888546" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="144.128677106876" y1="284.07007380960795" x2="140.72949016875157" y2="294.5316954888546" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="134.628677106876" y1="277.167919793557" x2="125.72949016875158" y2="283.6335575687742" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="131" y1="266" x2="120" y2="266" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="134.628677106876" y1="254.832080206443" x2="125.72949016875157" y2="248.3664424312258" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="144.12867710687598" y1="247.92992619039208" x2="140.72949016875157" y2="237.4683045111454" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="155.871322893124" y1="247.92992619039208" x2="159.2705098312484" y2="237.4683045111454" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="165.371322893124" y1="254.832080206443" x2="174.27050983124843" y2="248.3664424312258" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><circle cx="150" cy="266" r="15" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2.5"/><path d="M139 274 L145 262 L150 269 L155 262 L161 274" fill="none" stroke="var(--ink, #12172B)" stroke-width="1.8"/><text x="150" y="230" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">bulb</text><line x1="88" y1="266" x2="103.9" y2="266" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="112,266 103.9,270.95 103.9,261.05" fill="var(--absorb, #D6450B)"/><line x1="192" y1="266" x2="207.9" y2="266" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="216,266 207.9,270.95 207.9,261.05" fill="var(--absorb, #D6450B)"/><line x1="250" y1="288" x2="250" y2="305.9" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="250,314 245.05,305.9 254.95,305.9" fill="var(--absorb, #D6450B)"/><line x1="200" y1="356" x2="184.1" y2="356" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="176,356 184.1,351.05 184.1,360.95" fill="var(--absorb, #D6450B)"/><line x1="124" y1="356" x2="108.1" y2="356" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="100,356 108.1,351.05 108.1,360.95" fill="var(--absorb, #D6450B)"/><line x1="50" y1="350" x2="50" y2="338.1" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="50,330 54.95,338.1 45.05,338.1" fill="var(--absorb, #D6450B)"/><line x1="50" y1="284" x2="50" y2="284.1" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="50,276 54.95,284.1 45.05,284.1" fill="var(--absorb, #D6450B)"/><text x="292" y="290" text-anchor="start" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Closed loop</text><text x="292" y="310" text-anchor="start" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">The loop is complete.</text><text x="292" y="326.47" text-anchor="start" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Charges move around it</text><text x="292" y="342.94" text-anchor="start" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">together and the bulb glows.</text><text x="292" y="366" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Orange arrows show the direction.</text></svg>
