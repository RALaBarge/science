<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" role="img" aria-labelledby="d-54-hill-t d-54-hill-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-54-hill-t">One hill in the rain: four spheres</title><desc id="d-54-hill-d">A hillside in the rain. 1 Atmosphere: rain falls from a cloud. 2 Hydrosphere: water runs down the bare right slope and cuts a channel. 3 Geosphere: soil and rock are carried downhill, and a rock sits at the bottom. 4 Biosphere: grass on the left slope has roots that hold the soil in place. The four spheres touch and change each other in one place.</desc><rect x="0" y="0" width="480" height="450" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">One hill in the rain: four spheres</text><rect x="20" y="48" width="440" height="270" rx="8" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><circle cx="70" cy="84" r="20" fill="var(--surface-2, #E8EDF6)" stroke="var(--muted, #47506E)" stroke-width="1.5"/><circle cx="96" cy="76" r="25" fill="var(--surface-2, #E8EDF6)" stroke="var(--muted, #47506E)" stroke-width="1.5"/><circle cx="126" cy="84" r="20" fill="var(--surface-2, #E8EDF6)" stroke="var(--muted, #47506E)" stroke-width="1.5"/><circle cx="98" cy="92" r="22" fill="var(--surface-2, #E8EDF6)" stroke="var(--muted, #47506E)" stroke-width="1.5"/><line x1="60" y1="118" x2="54" y2="136" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round"/><line x1="80" y1="126" x2="74" y2="144" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round"/><line x1="100" y1="118" x2="94" y2="136" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round"/><line x1="120" y1="126" x2="114" y2="144" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round"/><line x1="140" y1="118" x2="134" y2="136" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" str