/><circle cx="240" cy="72" r="12" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><ellipse cx="205" cy="140" rx="30" ry="12" transform="rotate(-25 205 140)" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><ellipse cx="275" cy="150" rx="30" ry="12" transform="rotate(25 275 150)" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M240 190 q-30 30 -60 50 M240 190 q0 40 -6 80 M240 190 q30 30 60 50 M240 190 q40 20 80 20" fill="none" stroke="var(--absorb, #D6450B)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="190" x2="480" y2="190" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><text x="290" y="66" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">flower: makes seeds</text><text x="30" y="120" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">leaf: catches light</text><text x="320" y="176" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">stem: holds it up</text><text x="30" y="290" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">roots: hold and soak up water</text></svg>