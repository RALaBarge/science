<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 308" role="img" aria-labelledby="b52-orbit-t b52-orbit-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b52-orbit-t">Different stars in different seasons</title><desc id="b52-orbit-d">The Sun in the middle with a dashed oval for Earth's orbit. Earth is drawn twice: on the left in winter, with its dark night side facing away from the Sun toward the Orion stars, and on the right in summer, with its night side facing the opposite direction toward the Scorpius stars.</desc><rect x="0" y="0" width="480" height="308" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Different stars in different seasons</text><line x1="267.0" y1="150.0" x2="276.0" y2="150.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="263.4" y1="163.5" x2="271.2" y2="168.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="253.5" y1="173.4" x2="258.0" y2="181.2" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="240.0" y1="177.0" x2="240.0" y2="186.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="226.5" y1="173.4" x2="222.0" y2="181.2" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="216.6" y1="163.5" x2="208.8" y2="168.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="213.0" y1="150.0" x2="204.0" y2="150.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="216.6" y1="136.5" x2="208.8" y2="132.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="226.5" y1="126.6" x2="222.0" y2="118.8" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="240.0" y1="123.0" x2="240.0" y2="114.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="253.5" y1="126.6" x2="258.0" y2="118.8" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="263.4" y1="136.5" x2="271.2" y2="132.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><circle cx="240" cy="150" r="22" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="240" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Sun</text><ellipse cx="240" cy="150" rx="150" ry="100" fill="none" stroke="var(--muted, #47506E)" stroke-width="2" stroke-dasharray="5 5"/><circle cx="90" cy="150" r="20" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M90 130 A20 20 0 0 0 90 170Z" fill="var(--shade, #222A4A)" opacity=".8"/><text x="90" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Winter</text><line x1="66" y1="150" x2="28.1" y2="150.0" stroke="var(--muted, #47506E)" stroke-width="2.5" stroke-linecap="round"/><polygon points="20,150 28.1,145.1 28.1,154.9" fill="var(--muted, #47506E)"/><circle cx="390" cy="150" r="20" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M390 130 A20 20 0 0 1 390 170Z" fill="var(--shade, #222A4A)" opacity=".8"/><text x="390" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Summer</text><line x1="414" y1="150" x2="451.9" y2="150.0" stroke="var(--muted, #47506E)" stroke-width="2.5" stroke-linecap="round"/><polygon points="460,150 451.9,154.9 451.9,145.1" fill="var(--muted, #47506E)"/><text x="20" y="50" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Night side faces</text><text x="20" y="68" text-anchor="start" font-size="13" font-weight="700" fill="var(--reflect, #2B66E8)">Orion stars</text><text x="460" y="50" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Night side faces</text><text x="460" y="68" text-anchor="end" font-size="13" font-weight="700" fill="var(--absorb, #D6450B)">Scorpius stars</text><text x="240" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">Earth orbits the Sun once a year. The stars behind our night side change.</text><text x="240" y="288" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">Not to scale. The dark half of each Earth faces away from the Sun.</text></svg>