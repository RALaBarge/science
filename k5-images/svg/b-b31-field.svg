<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 364" role="img" aria-labelledby="b31-field-t b31-field-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b31-field-t">A magnet pulls without touching</title><desc id="b31-field-d">A bar magnet with a red north end on the left and a blue south end on the right. Curved blue lines loop from one end to the other, above and below, and are closest together at the ends. A paper clip near the north end has an arrow showing it is pulled toward the magnet.</desc><rect x="0" y="0" width="480" height="364" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A magnet pulls without touching</text><path d="M180 150 C110 40 370 40 300 150" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 150 C110 260 370 260 300 150" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 150 C140 85 340 85 300 150" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 150 C140 215 340 215 300 150" fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="248,67.5 236,60.5 236,74.5" fill="var(--reflect, #2B66E8)"/><polygon points="248,101.25 236,94.25 236,108.25" fill="var(--reflect, #2B66E8)"/><polygon points="248,232.5 236,225.5 236,239.5" fill="var(--reflect, #2B66E8)"/><polygon points="248,198.75 236,191.75 236,205.75" fill="var(--reflect, #2B66E8)"/><rect x="180" y="130" width="60" height="40" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="240" y="130" width="60" height="40" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="210" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="var(--on-color, #fff)">N</text><text x="270" y="157" text-anchor="middle" font-size="20" font-weight="700" fill="var(--on-color, #fff)">S</text><rect x="96" y="141" width="34" height="18" rx="9" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="104" y="146" width="18" height="8" rx="4" fill="none" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="134" y1="150" x2="157.2" y2="150.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="168,150 157.2,156.6 157.2,143.4" fill="var(--absorb, #D6450B)"/><text x="110" y="184" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">paper clip</text><text x="110" y="199.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">gets pulled in</text><text x="240" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">The blue lines show where the magnet reaches.</text><text x="240" y="322" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">They bunch up at the ends: the pull is strongest there.</text><text x="240" y="344" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">The force works through the air, and through thin paper.</text></svg>