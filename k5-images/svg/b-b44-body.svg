<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img" aria-labelledby="b44-body-t b44-body-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b44-body-t">Inside your body</title><desc id="b44-body-d">An outline of a body from the front. Inside the chest are two lungs, with a heart between them. Ribs wrap around, and a backbone runs down the middle. Labels give jobs: the heart pumps blood, the lungs take in air, the skeleton holds you up.</desc><rect x="0" y="0" width="480" height="240" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Inside your body</text><circle cx="170" cy="80" r="24" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M140 112 Q170 100 200 112 L214 220 L192 220 L170 168 L148 220 L126 220Z" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="156" cy="140" rx="14" ry="26" fill="var(--reflect, #2B66E8)" fill-opacity=".5" stroke="var(--ink, #12172B)" stroke-width="2"/><ellipse cx="184" cy="140" rx="14" ry="26" fill="var(--reflect, #2B66E8)" fill-opacity=".5" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M170 148 q-12 -12 -4 -20 q6 -4 4 4 q-2 -8 8 -4 q8 8 -8 20z" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="170" y1="116" x2="170" y2="190" stroke="var(--ink, #12172B)" stroke-width="4" stroke-linecap="round"/><path d="M170 124 q-24 4 -32 18 M170 124 q24 4 32 18" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 138 q-24 4 -32 18 M170 138 q24 4 32 18" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 152 q-24 4 -32 18 M170 152 q24 4 32 18" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170 166 q-24 4 -32 18 M170 166 q24 4 32 18" fill="none" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="100" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">skeleton: holds you up</text><text x="250" y="140" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--reflect, #2B66E8)">lungs: take in air</text><text x="250" y="180" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--red, #D93036)">heart: pumps blood</text><line x1="246" y1="138" x2="209.2" y2="139.7" stroke="var(--reflect, #2B66E8)" stroke-width="2" stroke-linecap="round"/><polygon points="202,140 209.0,135.3 209.4,144.1" fill="var(--reflect, #2B66E8)"/><line x1="246" y1="178" x2="194.4" y2="151.3" stroke="var(--red, #D93036)" stroke-width="2" stroke-linecap="round"/><polygon points="188,148 196.4,147.4 192.4,155.2" fill="var(--red, #D93036)"/><line x1="246" y1="98" x2="186.8" y2="117.7" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><polygon points="180,120 185.4,113.5 188.2,121.9" fill="var(--ink, #12172B)"/></svg>