<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" role="img" aria-labelledby="b51-rust-t b51-rust-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-rust-t">Iron becomes rust</title><desc id="b51-rust-d">A shiny iron nail on the left and a rusty, orange-brown nail on the right with an arrow between them labeled air and water over time.</desc><rect x="0" y="0" width="480" height="170" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Iron becomes rust</text><rect x="80" y="100" width="90" height="14" rx="3" fill="var(--reflect, #2B66E8)" fill-opacity="0.3" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="125" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">shiny iron</text><line x1="190" y1="107" x2="279.2" y2="107.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="290,107 279.2,113.6 279.2,100.4" fill="var(--absorb, #D6450B)"/><text x="240" y="90" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">air and water</text><text x="240" y="130" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">over time</text><rect x="310" y="100" width="90" height="14" rx="3" fill="var(--absorb, #D6450B)" fill-opacity="0.7" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="355" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">rusty: a new substance</text></svg>