<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="b53-lake-t b53-lake-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b53-lake-t">A Great Lakes food web</title><desc id="b53-lake-d">Algae at the bottom feed small fish. Small fish feed two large fish. The large fish feed birds. Arrows point to the eater. Decomposers sit on the left and work on anything that dies.</desc><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A Great Lakes food web</text><rect x="192" y="50" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Birds</text><rect x="82" y="110" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="130" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Large fish</text><rect x="302" y="110" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="350" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Large fish</text><rect x="192" y="170" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="195" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Small fish</text><rect x="192" y="230" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="255" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Algae</text><rect x="12" y="190" width="96" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="60" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Decomposers</text><line x1="240" y1="230" x2="240.0" y2="220.1" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="240,212 244.9,220.1 235.1,220.1" fill="var(--transmit, #0B7F70)"/><line x1="215" y1="172" x2="167.5" y2="153.0" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="160,150 169.4,148.4 165.7,157.6" fill="var(--transmit, #0B7F70)"/><line x1="265" y1="172" x2="312.5" y2="153.0" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="320,150 314.3,157.6 310.6,148.4" fill="var(--transmit, #0B7F70)"/><line x1="160" y1="112" x2="207.7" y2="89.5" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="215,86 209.8,93.9 205.6,85.0" fill="var(--transmit, #0B7F70)"/><line x1="320" y1="112" x2="272.3" y2="89.5" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="265,86 274.4,85.0 270.2,93.9" fill="var(--transmit, #0B7F70)"/><text x="240" y="292" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">An arrow points to the eater. Dead things feed the decomposers,</text><text x="240" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">which return matter to the water.</text></svg>