<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="d-43-eye-t d-43-eye-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-43-eye-t">How we see an apple</title><desc id="d-43-eye-d">Diagram of a lamp on the left, an apple in the middle and an eye on the right. Arrow 1 goes from the lamp to the apple. Arrow 2 goes from the apple into the eye. No arrow leaves the eye. Light from the lamp bounces off the apple and enters the eye, which is how we see it.</desc><rect x="0" y="0" width="480" height="340" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">How we see an apple</text><line x1="86" y1="86" x2="98" y2="86" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="81.41640786499875" y1="100.10684605501936" x2="91.1246117974981" y2="107.16026908252903" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="69.41640786499875" y1="108.82535639108369" x2="73.1246117974981" y2="120.23803458662553" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="54.58359213500126" y1="108.82535639108369" x2="50.875388202501895" y2="120.23803458662553" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="42.58359213500127" y1="100.10684605501936" x2="32.875388202501895" y2="107.16026908252904" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="38" y1="86" x2="26" y2="86" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="42.58359213500126" y1="71.89315394498064" x2="32.875388202501895" y2="64.83973091747097" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="54.58359213500126" y1="63.17464360891631" x2="50.87538820250189" y2="51.761965413374476" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="69.41640786499873" y1="63.17464360891631" x2="73.1246117974981" y2="51.76196541337447" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="81.41640786499873" y1="71.89315394498064" x2="91.1246117974981" y2="64.83973091747096" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><circle cx="62" cy="86" r="18" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="62" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Lamp</text><circle cx="236" cy="196" r="31" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M236 166 q4 -16 18 -18 q-2 14 -18 18z" fill="var(--green, #25904F)"/><text x="236" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Apple</text><path d="M366 192 Q410 154 454 192 Q410 230 366 192Z" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="410" cy="192" r="14" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="410" cy="192" r="6" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><text x="410" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Eye</text><line x1="84" y1="102" x2="198.02456534679197" y2="171.88602392222734" stroke="var(--beam, #F2A900)" stroke-width="4" stroke-linecap="round"/><polygon points="208,178 194.28824663259758,177.98212287696558 201.76088406098637,165.7899249674891" fill="var(--beam, #F2A900)"/><circle cx="146" cy="138" r="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="146" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">1</text><line x1="268" y1="198" x2="350.3165165671435" y2="193.62146188472641" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round"/><polygon points="362,193 350.6962988300318,200.7613684270276 349.93673430425514,186.48155534242522" fill="var(--reflect, #2B66E8)"/><circle cx="315" cy="176" r="11" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="315" y="181" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">2</text><text x="24" y="282" text-anchor="start" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">1  Light from the lamp hits the apple.</text><text x="24" y="304" text-anchor="start" font-size="14.5" font-weight="400" fill="var(--ink, #12172B)">2  Light bounces off the apple and enters the eye.</text><text x="24" y="326" text-anchor="start" font-size="14.5" font-weight="700" fill="var(--reflect, #2B66E8)">Nothing comes out of the eye. We see because light comes in.</text></svg>
