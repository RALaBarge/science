<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 434" role="img" aria-labelledby="d-41-coat-t d-41-coat-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-41-coat-t">Heat moves, and a coat slows it</title><desc id="d-41-coat-d">Top: a warm cup and a spoon, with a heat arrow along the spoon from the warm cup toward the cooler end. Bottom: two rows with a warm body on the left and cold air on the right. With no coat the heat arrow is thick and heat leaves fast. With a coat in between, the heat arrow is thin, so heat leaves slowly. A coat does not make heat; it slows the heat leaving.</desc><rect x="0" y="0" width="480" height="434" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Heat moves, and a coat slows it</text><text x="240" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Heat moves from warmer to cooler</text><rect x="30" y="82" width="70" height="64" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="65" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--on-color, #fff)">warm</text><text x="65" y="133" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--on-color, #fff)">cup</text><rect x="100" y="104" width="170" height="16" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="110" y1="94" x2="251.2" y2="94" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="262,94 251.2,100.6 251.2,87.4" fill="var(--absorb, #D6450B)"/><text x="186" y="80" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">heat moves along the spoon</text><text x="186" y="142" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">spoon</text><text x="292" y="100" text-anchor="start" font-size="13" font-weight="400" fill="var(--ink, #12172B)">The spoon</text><text x="292" y="115.86" text-anchor="start" font-size="13" font-weight="400" fill="var(--ink, #12172B)">warms up as the</text><text x="292" y="131.72" text-anchor="start" font-size="13" font-weight="400" fill="var(--ink, #12172B)">cup cools.</text><line x1="20" x2="460" y1="170" y2="170" stroke="var(--line, #D0D8E8)"/><text x="240" y="196" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">Why a coat helps: it slows heat leaving your body</text><text x="24" y="224" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">No coat</text><text x="456" y="224" text-anchor="end" font-size="13" font-weight="400" fill="var(--muted, #47506E)">heat leaves fast</text><rect x="24" y="234" width="76" height="54" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="62" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">warm</text><text x="62" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">body</text><rect x="370" y="234" width="86" height="54" rx="8" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="413" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">cold</text><text x="413" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">air</text><line x1="100" y1="261" x2="353.6" y2="261" stroke="var(--absorb, #D6450B)" stroke-width="8" stroke-linecap="round"/><polygon points="368,261 353.6,269.8 353.6,252.2" fill="var(--absorb, #D6450B)"/><text x="24" y="306" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">With a coat</text><text x="456" y="306" text-anchor="end" font-size="13" font-weight="400" fill="var(--muted, #47506E)">heat leaves slowly</text><rect x="24" y="316" width="76" height="54" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="62" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">warm</text><text x="62" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">body</text><rect x="370" y="316" width="86" height="54" rx="8" fill="var(--reflect, #2B66E8)" stroke="none" stroke-width="1.5"/><text x="413" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">cold</text><text x="413" y="361" text-anchor="middle" font-size="13" font-weight="700" fill="var(--on-color, #fff)">air</text><rect x="190" y="316" width="80" height="54" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="230" y="347" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">coat</text><text x="230" y="361" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">(trapped air)</text><line x1="100" y1="343" x2="180.8" y2="343" stroke="var(--absorb, #D6450B)" stroke-width="2" stroke-linecap="round"/><polygon points="188,343 180.8,347.4 180.8,338.6" fill="var(--absorb, #D6450B)"/><line x1="270" y1="343" x2="360.8" y2="343" stroke="var(--absorb, #D6450B)" stroke-width="2" stroke-linecap="round"/><polygon points="368,343 360.8,347.4 360.8,338.6" fill="var(--absorb, #D6450B)"/><text x="240" y="398" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">A coat does not make heat. Your body does.</text><text x="240" y="418" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">The coat slows the heat on its way out.</text></svg>
