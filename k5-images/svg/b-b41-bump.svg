<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="b41-bump-t b41-bump-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b41-bump-t">Bumper cars change direction</title><desc id="b41-bump-d">Two bumper cars seen from above. Before, they drive toward each other with arrows. After, they have bounced and move apart in new directions, with short arrows.</desc><rect x="0" y="0" width="480" height="250" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Bumper cars change direction</text><text x="120" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Before</text><rect x="40" y="90" width="56" height="30" rx="10" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="144" y="130" width="56" height="30" rx="10" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="100" y1="108" x2="118.9" y2="116.1" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="128,120 116.5,121.7 121.3,110.5" fill="var(--absorb, #D6450B)"/><line x1="140" y1="146" x2="121.1" y2="137.9" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="112,134 123.5,132.3 118.7,143.5" fill="var(--absorb, #D6450B)"/><text x="360" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">After</text><rect x="290" y="120" width="56" height="30" rx="10" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="394" y="100" width="56" height="30" rx="10" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="288" y1="140" x2="269.1" y2="154.5" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="262,160 265.8,150.2 272.5,158.9" fill="var(--absorb, #D6450B)"/><line x1="452" y1="112" x2="463.3" y2="102.0" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="470,96 466.9,106.1 459.6,97.9" fill="var(--absorb, #D6450B)"/><text x="240" y="220" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">They bump, then bounce away in new directions.</text></svg>