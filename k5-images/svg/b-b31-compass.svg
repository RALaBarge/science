<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 348" role="img" aria-labelledby="b31-compass-t b31-compass-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b31-compass-t">A compass needle points north</title><desc id="b31-compass-d">A round compass seen from above with N, E, S, W marked. The needle is red on the north end. A blue arrow beside it points up, to show Earth's magnetism pulling the needle.</desc><rect x="0" y="0" width="480" height="348" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A compass needle points north</text><circle cx="240" cy="170" r="100" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="3"/><circle cx="240" cy="170" r="86" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink, #12172B)">N</text><text x="240" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink, #12172B)">S</text><text x="163" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink, #12172B)">W</text><text x="317" y="178" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink, #12172B)">E</text><polygon points="240,112 227,170 253,170" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><polygon points="240,228 227,170 253,170" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><circle cx="240" cy="170" r="5" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><line x1="380" y1="222" x2="380.0" y2="131.7" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round"/><polygon points="380,120 387.1,131.7 372.9,131.7" fill="var(--reflect, #2B66E8)"/><text x="380" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">Earth's</text><text x="380" y="259.25" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">magnetism</text><text x="110" y="74" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">compass</text><text x="240" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">The red end of the needle swings to point north.</text><text x="240" y="328" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Earth acts like a giant magnet and pulls the needle.</text></svg>