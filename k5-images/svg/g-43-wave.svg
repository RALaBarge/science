<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="g-43-wave-t g-43-wave-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-43-wave-t">How far a wave moved an object</title><desc id="g-43-wave-d">Bar graph, How far a wave moved an object. Small wave 1 cm (about 1/2 inch), Large wave 3 cm (about 1 1/4 inches).</desc><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">How far a wave moved an object</text><line x1="54" x2="464" y1="268" y2="268" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="273" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">0</text><line x1="54" x2="464" y1="216.5" y2="216.5" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="221.5" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">1</text><line x1="54" x2="464" y1="165" y2="165" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="170" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">2</text><line x1="54" x2="464" y1="113.5" y2="113.5" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="118.5" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">3</text><line x1="54" x2="464" y1="62" y2="62" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="46" y="67" text-anchor="end" font-size="13" fill="var(--muted, #47506E)">4</text><text transform="translate(14 165) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">Movement in cm (1 cm is about 1/2 inch)</text><rect x="130.5" y="216.5" width="52" height="51.5" rx="3" fill="var(--reflect, #2B66E8)" /><text x="156.5" y="210.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">1 cm</text><text x="156.5" y="288" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Small wave</text><text x="156.5" y="306" text-anchor="middle" font-size="12.5" fill="var(--muted, #47506E)">1 cm (about 1/2 inch)</text><rect x="335.5" y="113.5" width="52" height="154.5" rx="3" fill="var(--reflect, #2B66E8)" /><text x="361.5" y="107.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">3 cm</text><text x="361.5" y="288" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Large wave</text><text x="361.5" y="306" text-anchor="middle" font-size="12.5" fill="var(--muted, #47506E)">3 cm (about 1 1/4 inches)</text><line x1="54" x2="464" y1="268" y2="268" stroke="var(--ink, #12172B)" stroke-width="1.5"/></svg>
