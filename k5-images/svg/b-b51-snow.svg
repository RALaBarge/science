<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img" aria-labelledby="b51-snow-t b51-snow-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-snow-t">Snow melts into water</title><desc id="b51-snow-d">Three steps left to right: a snowflake (solid water), a drop (liquid water) after warming, with an arrow labeled warm between them. It is still water at every step.</desc><rect x="0" y="0" width="480" height="190" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Snow melts into water</text><line x1="144" y1="110" x2="76" y2="110" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round"/><line x1="127" y1="139.44486372867092" x2="93" y2="80.55513627132909" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round"/><line x1="93" y1="139.44486372867092" x2="127" y2="80.55513627132908" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round"/><text x="110" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">snow (solid)</text><line x1="180" y1="110" x2="288.3" y2="110.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="300,110 288.3,117.2 288.3,102.8" fill="var(--absorb, #D6450B)"/><text x="240" y="96" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">warms</text><path d="M370 76 Q350 120 370 136 Q392 120 370 76Z" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="370" y="170" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">water (liquid)</text></svg>