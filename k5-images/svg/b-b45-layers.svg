<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="b45-layers-t b45-layers-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b45-layers-t">Older layers are usually deeper</title><desc id="b45-layers-d">A cut-away cliff shows four rock layers in different colors, stacked. The bottom layer is labeled oldest, the top is labeled newest. A snail-shell fossil is in the top layer and a different fossil is in a lower layer.</desc><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Older layers are usually deeper</text><rect x="50" y="60" width="250" height="50" rx="0" fill="var(--beam, #F2A900)" fill-opacity=".5" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="50" y="110" width="250" height="50" rx="0" fill="var(--absorb, #D6450B)" fill-opacity=".45" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="50" y="160" width="250" height="50" rx="0" fill="var(--reflect, #2B66E8)" fill-opacity=".4" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="50" y="210" width="250" height="50" rx="0" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M100 92 q10 -16 22 -4 q8 10 -4 14 q-12 4 -18 -10z" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><ellipse cx="220" cy="236" rx="22" ry="8" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><ellipse cx="160" cy="184" rx="18" ry="8" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="380" y1="80" x2="380.0" y2="67.2" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><polygon points="380,60 384.4,67.2 375.6,67.2" fill="var(--ink, #12172B)"/><text x="320" y="98" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">newest (top)</text><text x="320" y="252" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">oldest (bottom)</text><line x1="450" y1="90" x2="450.0" y2="240.1" stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-linecap="round"/><polygon points="450,250 443.9,240.1 456.1,240.1" fill="var(--ink, #12172B)"/><text x="400" y="150" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">time</text><text x="175" y="296" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">white shapes are fossils</text></svg>