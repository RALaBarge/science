<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 362" role="img" aria-labelledby="d-1c-stars-t d-1c-stars-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-1c-stars-t">Stars are still there in the day</title><desc id="d-1c-stars-d">Two sky pictures side by side with the same star positions. Left, night: a dark sky with stars and a crescent Moon, so the stars can be seen. Right, day: a bright blue sky with the Sun and no visible stars, but dashed circles show where the stars still are. Stars do not turn off in the day. They are faraway suns, and the bright daytime sky hides them.</desc><rect x="0" y="0" width="480" height="362" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Stars are still there in the day</text><text x="125" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Night</text><text x="355" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Day</text><rect x="20" y="70" width="210" height="160" rx="8" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="2"/><path d="M60 104 L61.8 108.2 L66 110 L61.8 111.8 L60 116 L58.2 111.8 L54 110 L58.2 108.2Z" fill="#fff"/><path d="M112 138 L113.8 142.2 L118 144 L113.8 145.8 L112 150 L110.2 145.8 L106 144 L110.2 142.2Z" fill="#fff"/><path d="M148 94 L149.8 98.2 L154 100 L149.8 101.8 L148 106 L146.2 101.8 L142 100 L146.2 98.2Z" fill="#fff"/><path d="M200 162 L201.8 166.2 L206 168 L201.8 169.8 L200 174 L198.2 169.8 L194 168 L198.2 166.2Z" fill="#fff"/><path d="M84 176 L85.8 180.2 L90 182 L85.8 183.8 L84 188 L82.2 183.8 L78 182 L82.2 180.2Z" fill="#fff"/><path d="M140 192 L141.8 196.2 L146 198 L141.8 199.8 L140 204 L138.2 199.8 L134 198 L138.2 196.2Z" fill="#fff"/><path d="M50 148 L51.8 152.2 L56 154 L51.8 155.8 L50 160 L48.2 155.8 L44 154 L48.2 152.2Z" fill="#fff"/><circle cx="196" cy="100" r="14" fill="#E8EDF6" stroke="none" stroke-width="1.5"/><circle cx="203" cy="95" r="12" fill="var(--shade, #222A4A)"/><rect x="250" y="70" width="210" height="160" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="251" y="71" width="208" height="158" rx="7" fill="var(--reflect, #2B66E8)" opacity=".3"/><circle cx="290" cy="110" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="342" cy="144" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="378" cy="100" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="430" cy="168" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="314" cy="182" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="370" cy="198" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="280" cy="154" r="7" fill="none" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="444" y1="102" x2="454" y2="102" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="440.180339887499" y1="113.75570504584947" x2="448.27050983124843" y2="119.6335575687742" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="430.180339887499" y1="121.02113032590307" x2="433.27050983124843" y2="130.5316954888546" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="417.819660112501" y1="121.02113032590307" x2="414.72949016875157" y2="130.5316954888546" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="407.8196601125011" y1="113.75570504584947" x2="399.72949016875157" y2="119.6335575687742" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="404" y1="102" x2="394" y2="102" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="407.819660112501" y1="90.24429495415055" x2="399.72949016875157" y2="84.3664424312258" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="417.819660112501" y1="82.97886967409693" x2="414.72949016875157" y2="73.46830451114539" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="430.1803398874989" y1="82.97886967409693" x2="433.27050983124843" y2="73.46830451114539" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><line x1="440.1803398874989" y1="90.24429495415053" x2="448.27050983124843" y2="84.3664424312258" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><circle cx="424" cy="102" r="15" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="125" y="252" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Dark sky: we can see</text><text x="125" y="267" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">the faint light of stars.</text><text x="355" y="252" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">Bright sky: sunlight hides</text><text x="355" y="267" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">the stars. Dashed circles</text><text x="355" y="282" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">show where they still are.</text><text x="240" y="322" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">Stars do not turn off in the day.</text><text x="240" y="344" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Stars are faraway suns. The bright daytime sky hides them.</text></svg>
