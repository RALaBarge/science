<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 266" role="img" aria-labelledby="b42-wire-t b42-wire-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b42-wire-t">A wire has metal and plastic</title><desc id="b42-wire-d">A cut-open wire shows a metal core in the middle, labelled carries electric current, and a plastic coating around it, labelled keeps you safe.</desc><rect x="0" y="0" width="480" height="266" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A wire has metal and plastic</text><circle cx="110" cy="140" r="56" fill="var(--reflect, #2B66E8)" fill-opacity=".4" stroke="var(--ink, #12172B)" stroke-width="3"/><circle cx="110" cy="140" r="26" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="110" y="222" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">end view</text><rect x="220" y="118" width="240" height="44" rx="6" fill="var(--reflect, #2B66E8)" fill-opacity=".4" stroke="var(--ink, #12172B)" stroke-width="2"/><rect x="220" y="130" width="240" height="20" rx="4" fill="var(--absorb, #D6450B)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="340" y="188" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">side view</text><line x1="150" y1="92" x2="182.8" y2="75.6" stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-linecap="round"/><polygon points="190,72 185.0,80.0 180.5,71.2" fill="var(--ink, #12172B)"/><text x="240" y="66" text-anchor="start" font-size="13" font-weight="700" fill="var(--ink, #12172B)">plastic coat (blue): keeps you safe</text><line x1="300" y1="230" x2="300.0" y2="160.1" stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-linecap="round"/><polygon points="300,152 304.9,160.1 295.1,160.1" fill="var(--ink, #12172B)"/><text x="300" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">metal core (orange): carries current</text></svg>