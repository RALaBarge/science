<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img" aria-labelledby="b42-conv-t b42-conv-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b42-conv-t">Energy changes form</title><desc id="b42-conv-d">Three boxes joined by arrows: a battery with stored chemical energy, wires carrying electrical energy, and an LED. From the LED two arrows leave: a big one for light and a small one for a little heat.</desc><rect x="0" y="0" width="480" height="230" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Energy changes form</text><rect x="14" y="70" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="74" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Battery</text><text x="74" y="122" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">stored energy</text><rect x="180" y="70" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Wires</text><text x="240" y="122" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">electrical energy</text><rect x="346" y="70" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="406" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">LED</text><text x="406" y="122" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">changes it</text><line x1="136" y1="105" x2="167.2" y2="105.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="178,105 167.2,111.6 167.2,98.4" fill="var(--transmit, #0B7F70)"/><line x1="302" y1="105" x2="333.2" y2="105.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="344,105 333.2,111.6 333.2,98.4" fill="var(--transmit, #0B7F70)"/><line x1="406" y1="70" x2="406.0" y2="56.6" stroke="var(--beam, #F2A900)" stroke-width="6" stroke-linecap="round"/><polygon points="406,44 413.7,56.6 398.3,56.6" fill="var(--beam, #F2A900)"/><text x="420" y="52" text-anchor="start" font-size="13" font-weight="700" fill="var(--ink, #12172B)">light</text><line x1="446" y1="140" x2="446.0" y2="168.1" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="446,178 439.9,168.1 452.1,168.1" fill="var(--absorb, #D6450B)"/><text x="446" y="198" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--absorb, #D6450B)">a little heat</text></svg>