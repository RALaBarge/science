<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="d-53-matter-energy-t d-53-matter-energy-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-53-matter-energy-t">Matter cycles. Energy does not.</title><desc id="d-53-matter-energy-d">Two diagrams. Top: matter moves in a loop. Soil and air give air, water and minerals to plants, plants are eaten by animals, animals die or make waste for decomposers, and decomposers break it down into soil and air again. Matter is reused, not used up. Bottom: energy moves one way. Sunlight goes to plants, plants to animals, and heat leaves from the plant and the animal at every step. Energy does not come back around.</desc><rect x="0" y="0" width="480" height="440" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Matter cycles. Energy does not.</text><text x="240" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Matter goes around in a cycle</text><rect x="30" y="78" width="130" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="95" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Plant</text><rect x="320" y="78" width="130" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="385" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Animal</text><rect x="320" y="176" width="130" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="385" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Decomposers</text><rect x="30" y="176" width="130" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="95" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Soil and air</text><line x1="95" y1="176" x2="95" y2="135.9" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="95,126 101.05,135.9 88.95,135.9" fill="var(--transmit, #0B7F70)"/><text x="104" y="148" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">air, water,</text><text x="104" y="163.25" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">minerals</text><line x1="160" y1="101" x2="308.1" y2="101" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="318,101 308.1,107.05 308.1,94.95" fill="var(--transmit, #0B7F70)"/><text x="239" y="93" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">eaten</text><line x1="385" y1="124" x2="385" y2="164.1" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="385,174 378.95,164.1 391.05,164.1" fill="var(--transmit, #0B7F70)"/><text x="393" y="154" text-anchor="start" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">dies, waste</text><line x1="320" y1="199" x2="171.9" y2="199" stroke="var(--transmit, #0B7F70)" stroke-width="3" stroke-linecap="round"/><polygon points="162,199 171.9,192.95 171.9,205.05" fill="var(--transmit, #0B7F70)"/><text x="241" y="191" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">breaks down</text><text x="240" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="var(--transmit, #0B7F70)">Matter is reused,</text><text x="240" y="161.07999999999998" text-anchor="middle" font-size="14" font-weight="700" fill="var(--transmit, #0B7F70)">not used up</text><line x1="20" x2="460" y1="244" y2="244" stroke="var(--line, #D0D8E8)"/><text x="240" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Energy goes one way and leaves as heat</text><rect x="14" y="290" width="104" height="46" rx="8" fill="var(--beam, #F2A900)" stroke="none" stroke-width="1.5"/><text x="66" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="var(--beam-ink, #1A1400)">Sunlight</text><rect x="148" y="290" width="92" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="194" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Plant</text><rect x="270" y="290" width="92" height="46" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="316" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Animal</text><rect x="392" y="290" width="74" height="46" rx="8" fill="var(--absorb, #D6450B)" stroke="none" stroke-width="1.5"/><text x="429" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="var(--on-color, #fff)">Heat</text><line x1="118" y1="313" x2="136.1" y2="313" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><polygon points="146,313 136.1,319.05 136.1,306.95" fill="var(--beam, #F2A900)"/><line x1="240" y1="313" x2="258.1" y2="313" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><polygon points="268,313 258.1,319.05 258.1,306.95" fill="var(--beam, #F2A900)"/><line x1="362" y1="313" x2="380.1" y2="313" stroke="var(--beam, #F2A900)" stroke-width="3" stroke-linecap="round"/><polygon points="390,313 380.1,319.05 380.1,306.95" fill="var(--beam, #F2A900)"/><line x1="194" y1="336" x2="194" y2="368.1" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="194,378 187.95,368.1 200.05,368.1" fill="var(--absorb, #D6450B)"/><line x1="316" y1="336" x2="316" y2="368.1" stroke="var(--absorb, #D6450B)" stroke-width="3" stroke-linecap="round"/><polygon points="316,378 309.95,368.1 322.05,368.1" fill="var(--absorb, #D6450B)"/><text x="240" y="404" text-anchor="middle" font-size="14" font-weight="400" fill="var(--ink, #12172B)">Some energy leaves as heat at every step.</text><text x="240" y="424" text-anchor="middle" font-size="14" font-weight="700" fill="var(--absorb, #D6450B)">It does not come back around.</text></svg>
