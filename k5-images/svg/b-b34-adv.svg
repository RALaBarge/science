<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 276" role="img" aria-labelledby="b34-adv-t b34-adv-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b34-adv-t">A trait that gives an advantage</title><desc id="b34-adv-d">Three boxes joined by arrows: the trait, a thicker coat of fur, helps in an environment, a cold snowy winter, so more of these deer live to have fawns. A note says a trait helps only where it matters.</desc><rect x="0" y="0" width="480" height="276" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">A trait that gives an advantage</text><rect x="14" y="80" width="124" height="100" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="76" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Trait</text><text x="76" y="142" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">a thicker coat</text><text x="76" y="160" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">of fur</text><rect x="178" y="80" width="124" height="100" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="240" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Environment</text><text x="240" y="142" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">a cold, snowy</text><text x="240" y="160" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">winter</text><rect x="342" y="80" width="124" height="100" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="404" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Result</text><text x="404" y="142" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">more of these deer</text><text x="404" y="160" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">live to have fawns</text><line x1="140" y1="130" x2="165.2" y2="130.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="176,130 165.2,136.6 165.2,123.4" fill="var(--absorb, #D6450B)"/><line x1="304" y1="130" x2="329.2" y2="130.0" stroke="var(--absorb, #D6450B)" stroke-width="4" stroke-linecap="round"/><polygon points="340,130 329.2,136.6 329.2,123.4" fill="var(--absorb, #D6450B)"/><text x="158" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">helps in</text><text x="322" y="118" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">so</text><text x="240" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">A trait helps only in an environment where it matters.</text><text x="240" y="252" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">In a warm place, thick fur would not give the same advantage.</text></svg>