ats chicken</text><text x="240" y="206" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">The arrows show energy moving. It started as sunlight.</text><text x="240" y="228" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">Some energy leaves as heat at every step.</text></svg>