<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 248" role="img" aria-labelledby="b53-chain-t b53-chain-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b53-chain-t">Energy from the Sun to you</title><desc id="b53-chain-d">A chain from left to right: the Sun, then corn, then chicken, then a child. Arrows show energy moving along the chain. A note says some energy leaves as heat at each step.</desc><rect x="0" y="0" width="480" height="248" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Energy from the Sun to you</text><line x1="77.0" y1="100.0" x2="86.0" y2="100.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="73.4" y1="113.5" x2="81.2" y2="118.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="63.5" y1="123.4" x2="68.0" y2="131.2" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="50.0" y1="127.0" x2="50.0" y2="136.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="36.5" y1="123.4" x2="32.0" y2="131.2" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="26.6" y1="113.5" x2="18.8" y2="118.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="23.0" y1="100.0" x2="14.0" y2="100.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="26.6" y1="86.5" x2="18.8" y2="82.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="36.5" y1="76.6" x2="32.0" y2="68.8" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="50.0" y1="73.0" x2="50.0" y2="64.0" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="63.5" y1="76.6" x2="68.0" y2="68.8" stroke="var(--beam, #F2A900)" stroke-width="2.5" stroke-linecap="round"/><line x1="73.4" y1="86.5" 