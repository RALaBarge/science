<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 338" role="img" aria-labelledby="d-31-forces-t d-31-forces-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-31-forces-t">Balanced and unbalanced forces</title><desc id="d-31-forces-d">Two pictures of an object with force arrows. Top: a push forward and friction backward are the same length, so the forces are balanced and the object keeps moving at the same steady speed. Bottom: the push forward is longer than the friction arrow, so the forces are unbalanced and the object speeds up.</desc><rect x="0" y="0" width="480" height="338" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Balanced and unbalanced forces</text><text x="240" y="58" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">Balanced: equal forces, motion stays the same</text><line x1="200" y1="108" x2="142.6" y2="108" stroke="var(--absorb, #D6450B)" stroke-width="5" stroke-linecap="round"/><polygon points="130,108 142.6,100.3 142.6,115.7" fill="var(--absorb, #D6450B)"/><text x="160" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">friction</text><text x="160" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">backward</text><rect x="200" y="88" width="80" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="240" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">object</text><line x1="280" y1="108" x2="337.4" y2="108" stroke="var(--reflect, #2B66E8)" stroke-width="5" stroke-linecap="round"/><polygon points="350,108 337.4,115.7 337.4,100.3" fill="var(--reflect, #2B66E8)"/><text x="320" y="90" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">push</text><text x="320" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #47506E)">forward</text><line x1="212" y1="72" x2="259.9" y2="72" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="268,72 259.9,76.95 259.9,67.05" fill="var(--muted, #47506E)"/><text x="280" y="76" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #47506E)">steady speed</text><text x="240" y="168" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">The arrows are the same length, so the speed does not change.</text><line x1="20" x2="460" y1="190" y2="190" stroke="var(--line, #D0D8E8)"/><text x="240" y="218" text-anchor="middle" font-size="14.5" font-weight="700" fill="var(--ink, #12172B)">Unbalanced: unequal forces, motion changes</text><line x1="200" y1="270" x2="172.6" y2="270" stroke="var(--absorb, #D6450B)" stroke-width="5" stroke-linecap="round"/><polygon points="160,270 172.6,262.3 172.6,277.7" fill="var(--absorb, #D6450B)"/><text x="168" y="252" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">friction</text><rect x="200" y="250" width="80" height="40" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="1.5"/><text x="240" y="275" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">object</text><line x1="280" y1="270" x2="383.4" y2="270" stroke="var(--reflect, #2B66E8)" stroke-width="5" stroke-linecap="round"/><polygon points="396,270 383.4,277.7 383.4,262.3" fill="var(--reflect, #2B66E8)"/><text x="338" y="252" text-anchor="middle" font-size="13" font-weight="400" fill="var(--ink, #12172B)">bigger push</text><line x1="212" y1="234" x2="259.9" y2="234" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="268,234 259.9,238.95 259.9,229.05" fill="var(--muted, #47506E)"/><text x="240" y="322" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #47506E)">The forward arrow is longer, so the object speeds up.</text></svg>
