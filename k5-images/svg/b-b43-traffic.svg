<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="b43-traffic-t b43-traffic-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b43-traffic-t">Color patterns tell drivers what to do</title><desc id="b43-traffic-d">A traffic light with a red, yellow and green lamp. Next to each lamp is its meaning: red means stop, yellow means get ready to stop, green means go.</desc><rect x="0" y="0" width="480" height="300" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Color patterns tell drivers what to do</text><rect x="150" y="50" width="60" height="190" rx="14" fill="var(--shade, #222A4A)" stroke="var(--ink, #12172B)" stroke-width="3"/><circle cx="180" cy="90" r="20" fill="var(--red, #D93036)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="180" cy="145" r="20" fill="var(--beam, #F2A900)" stroke="var(--ink, #12172B)" stroke-width="2"/><circle cx="180" cy="200" r="20" fill="var(--green, #25904F)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="230" y="96" text-anchor="start" font-size="15" font-weight="700" fill="var(--ink, #12172B)">red: stop</text><text x="230" y="151" text-anchor="start" font-size="14" font-weight="700" fill="var(--ink, #12172B)">yellow: get ready to stop</text><text x="230" y="206" text-anchor="start" font-size="15" font-weight="700" fill="var(--ink, #12172B)">green: go</text><text x="240" y="275" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Drivers read the color and know what to do.</text></svg>