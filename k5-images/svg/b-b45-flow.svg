<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="b45-flow-t b45-flow-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b45-flow-t">From resource to use</title><desc id="b45-flow-d">Two paths from left to right. Top: natural gas stored underground travels by pipe to homes, where it makes heat. Bottom: wind turns a turbine, which makes electricity for lights.</desc><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">From resource to use</text><rect x="14" y="56" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="74" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Natural gas</text><text x="74" y="104" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">underground</text><line x1="136" y1="91" x2="179.2" y2="91.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="190,91 179.2,97.6 179.2,84.4" fill="var(--transmit, #0B7F70)"/><text x="163" y="78" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">pipe</text><rect x="194" y="56" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="254" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Gas is burned</text><text x="254" y="104" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">makes heat</text><line x1="316" y1="91" x2="349.2" y2="91.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="360,91 349.2,97.6 349.2,84.4" fill="var(--transmit, #0B7F70)"/><rect x="364" y="56" width="102" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="415" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Warm home</text><line x1="20" y1="170" x2="460" y2="170" stroke="var(--line, #D0D8E8)" stroke-width="1" stroke-linecap="round"/><rect x="14" y="196" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="74" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Wind</text><text x="74" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">moving air</text><line x1="136" y1="231" x2="179.2" y2="231.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="190,231 179.2,237.6 179.2,224.4" fill="var(--transmit, #0B7F70)"/><rect x="194" y="196" width="120" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="254" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Turbine spins</text><text x="254" y="244" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--muted, #47506E)">makes electricity</text><line x1="316" y1="231" x2="349.2" y2="231.0" stroke="var(--transmit, #0B7F70)" stroke-width="4" stroke-linecap="round"/><polygon points="360,231 349.2,237.6 349.2,224.4" fill="var(--transmit, #0B7F70)"/><rect x="364" y="196" width="102" height="70" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)" stroke-width="1.5"/><text x="415" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Lights</text><text x="240" y="308" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">Each source has an effect: gas puts gases in the air; turbines need open land.</text></svg>