<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 272" role="img" aria-labelledby="b51-balance-t b51-balance-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-balance-t">Does air have mass?</title><desc id="b51-balance-d">A stick balanced on a stand. A full balloon hangs from one end and a flat balloon from the other end. The side with the full balloon tips down a little.</desc><rect x="0" y="0" width="480" height="272" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Does air have mass?</text><line x1="240" y1="80" x2="240" y2="190" stroke="var(--ink, #12172B)" stroke-width="5" stroke-linecap="round"/><rect x="200" y="190" width="80" height="12" rx="3" fill="var(--ink, #12172B)" stroke="var(--ink, #12172B)" stroke-width="2"/><line x1="100" y1="90" x2="380" y2="80" stroke="var(--ink, #12172B)" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="90" x2="100" y2="120" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><line x1="380" y1="80" x2="380" y2="110" stroke="var(--ink, #12172B)" stroke-width="2" stroke-linecap="round"/><circle cx="100" cy="150" r="28" fill="var(--reflect, #2B66E8)" fill-opacity="0.4" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="100" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink, #12172B)">air</text><circle cx="380" cy="140" r="28" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="380" y="145" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">flat</text><text x="100" y="200" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">full balloon</text><text x="380" y="190" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">flat balloon</text><text x="240" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">The full side goes down a little. The air inside has mass.</text><text x="240" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">If it does not tip, try a pumped-up ball and a flat ball on a kitchen scale.</text></svg>