<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="b33-stages-t b33-stages-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b33-stages-t">Shared life-cycle stages</title><desc id="b33-stages-d">A table with columns Begin, Grow, Reproduce and End and rows for frog, bean plant and mealworm beetle. Frog: egg, tadpole and froglet, adult lays eggs, adult dies. Bean plant: seed, sprout and plant, flowers and new seeds, plant dies. Mealworm beetle: egg, mealworm and pupa, adult beetle lays eggs, adult dies.</desc><rect x="0" y="0" width="480" height="320" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Shared life-cycle stages</text><rect x="100" y="48" width="90" height="30" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="145" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Begin</text><rect x="190" y="48" width="90" height="30" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="235" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Grow</text><rect x="280" y="48" width="102" height="30" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="331" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Reproduce</text><rect x="382" y="48" width="90" height="30" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="427" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">End</text><rect x="6" y="78" width="94" height="64" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="53" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Frog</text><rect x="100" y="78" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="145" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">egg</text><rect x="190" y="78" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="235" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">tadpole,</text><text x="235" y="128.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">froglet</text><rect x="280" y="78" width="102" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="331" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">adult</text><text x="331" y="128.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">lays eggs</text><rect x="382" y="78" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="427" y="114" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">adult dies</text><rect x="6" y="142" width="94" height="64" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="53" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Bean</text><text x="53" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">plant</text><rect x="100" y="142" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="145" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">seed</text><rect x="190" y="142" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="235" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">sprout, plant</text><rect x="280" y="142" width="102" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="331" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">flowers,</text><text x="331" y="192.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">new seeds</text><rect x="382" y="142" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="427" y="178" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">plant dies</text><rect x="6" y="206" width="94" height="64" fill="var(--surface-2, #E8EDF6)" stroke="var(--line, #D0D8E8)"/><text x="53" y="243" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Mealworm</text><text x="53" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">beetle</text><rect x="100" y="206" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="145" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">egg</text><rect x="190" y="206" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="235" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">mealworm,</text><text x="235" y="256.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">pupa</text><rect x="280" y="206" width="102" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="331" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">adult beetle</text><text x="331" y="256.64" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">lays eggs</text><rect x="382" y="206" width="90" height="64" fill="var(--surface, #fff)" stroke="var(--line, #D0D8E8)"/><text x="427" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ink, #12172B)">adult dies</text><text x="240" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">Different animals and plants, the same four stages.</text></svg>