<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="d-43-wave-t d-43-wave-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-43-wave-t">Parts of a wave</title><desc id="d-43-wave-d">A blue wave line over a dashed resting line. Wavelength is the distance from one crest to the next crest. Amplitude is the height of the wave above the resting line. A cork floats on the wave and mostly moves up and down while the wave moves forward to the right. A taller wave, with more amplitude, carries more energy.</desc><rect x="0" y="0" width="480" height="330" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Parts of a wave</text><line x1="24" x2="456" y1="150" y2="150" stroke="var(--muted, #47506E)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="30" y="222" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #47506E)">dashed line = resting line (no wave)</text><path d="M30 150.0 L34 143.7 L38 137.6 L42 131.8 L46 126.5 L50 121.7 L54 117.6 L58 114.4 L62 112.0 L66 110.5 L70 110.0 L74 110.5 L78 112.0 L82 114.4 L86 117.6 L90 121.7 L94 126.5 L98 131.8 L102 137.6 L106 143.7 L110 150.0 L114 156.3 L118 162.4 L122 168.2 L126 173.5 L130 178.3 L134 182.4 L138 185.6 L142 188.0 L146 189.5 L150 190.0 L154 189.5 L158 188.0 L162 185.6 L166 182.4 L170 178.3 L174 173.5 L178 168.2 L182 162.4 L186 156.3 L190 150.0 L194 143.7 L198 137.6 L202 131.8 L206 126.5 L210 121.7 L214 117.6 L218 114.4 L222 112.0 L226 110.5 L230 110.0 L234 110.5 L238 112.0 L242 114.4 L246 117.6 L250 121.7 L254 126.5 L258 131.8 L262 137.6 L266 143.7 L270 150.0 L274 156.3 L278 162.4 L282 168.2 L286 173.5 L290 178.3 L294 182.4 L298 185.6 L302 188.0 L306 189.5 L310 190.0 L314 189.5 L318 188.0 L322 185.6 L326 182.4 L330 178.3 L334 173.5 L338 168.2 L342 162.4 L346 156.3 L350 150.0 L354 143.7 L358 137.6 L362 131.8 L366 126.5 L370 121.7 L374 117.6 L378 114.4 L382 112.0 L386 110.5 L390 110.0 L394 110.5 L398 112.0 L402 114.4 L406 117.6 L410 121.7 L414 126.5 L418 131.8 L422 137.6 L426 143.7 L430 150.0 L434 156.3 L438 162.4 L442 168.2 L446 173.5 L450 178.3 " fill="none" stroke="var(--reflect, #2B66E8)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="70" x2="70" y1="106" y2="70" stroke="var(--line, #D0D8E8)"/><line x1="230" x2="230" y1="106" y2="70" stroke="var(--line, #D0D8E8)"/><line x1="72" y1="78" x2="219" y2="78" stroke="var(--absorb, #D6450B)" stroke-width="2.5" stroke-linecap="round"/><polygon points="228,78 219,83.5 219,72.5" fill="var(--absorb, #D6450B)"/><line x1="228" y1="78" x2="81" y2="78" stroke="var(--absorb, #D6450B)" stroke-width="2.5" stroke-linecap="round"/><polygon points="72,78 81,72.5 81,83.5" fill="var(--absorb, #D6450B)"/><text x="150" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="var(--absorb, #D6450B)">wavelength</text><text x="150" y="98" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">(crest to crest)</text><line x1="390" y1="148" x2="390" y2="121" stroke="var(--transmit, #0B7F70)" stroke-width="2.5" stroke-linecap="round"/><polygon points="390,112 395.5,121 384.5,121" fill="var(--transmit, #0B7F70)"/><line x1="390" y1="112" x2="390" y2="139" stroke="var(--transmit, #0B7F70)" stroke-width="2.5" stroke-linecap="round"/><polygon points="390,148 384.5,139 395.5,139" fill="var(--transmit, #0B7F70)"/><text x="390" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="var(--transmit, #0B7F70)">amplitude</text><text x="390" y="98" text-anchor="middle" font-size="11.5" font-weight="400" fill="var(--muted, #47506E)">(height)</text><rect x="298" y="176" width="24" height="14" rx="5" fill="#C8A46E" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="310" y1="194" x2="310" y2="210.8" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="310,218 305.6,210.8 314.4,210.8" fill="var(--muted, #47506E)"/><line x1="310" y1="218" x2="310" y2="201.2" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="310,194 314.4,201.2 305.6,201.2" fill="var(--muted, #47506E)"/><text x="310" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">cork</text><line x1="350" y1="214" x2="430.1" y2="214" stroke="var(--reflect, #2B66E8)" stroke-width="3" stroke-linecap="round"/><polygon points="440,214 430.1,220.05 430.1,207.95" fill="var(--reflect, #2B66E8)"/><text x="396" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--reflect, #2B66E8)">wave moves</text><text x="240" y="292" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">The wave moves forward. The cork mostly moves up and down.</text><text x="240" y="312" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">A taller wave (more amplitude) carries more energy.</text></svg>
