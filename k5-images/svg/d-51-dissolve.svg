<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 326" role="img" aria-labelledby="d-51-dissolve-t d-51-dissolve-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="d-51-dissolve-t">Salt dissolves but does not disappear</title><desc id="d-51-dissolve-d">Four steps left to right. 1 Mix: salt grains and sand in a cup of water. 2 Stir: the salt dissolves, so the salt bits spread through the water as dots too small to see, and the sand stays at the bottom. 3 Filter: the sand stays on the filter paper and the salt water drips into the cup below. 4 Evaporate: the water leaves a dish and white salt crystals remain. Dissolved salt is not gone. Filtering takes out the sand, and evaporating brings the salt back.</desc><rect x="0" y="0" width="480" height="326" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Salt dissolves but does not disappear</text><text x="66" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">1  Mix</text><text x="182" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">2  Stir</text><text x="298" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">3  Filter</text><text x="414" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">4  Evaporate</text><path d="M14 96 L22 190 H110 L118 96" fill="none" stroke="var(--ink, #12172B)" stroke-width="2.5" stroke-linejoin="round"/><path d="M15.2 110 L22 190 H110 L116.8 110Z" fill="var(--reflect, #2B66E8)" opacity=".28"/><circle cx="36" cy="184" r="3.2" fill="#C8A46E" stroke="none" stroke-width="1"/><circle cx="52" cy="182" r="3.2" fill="#C8A46E" stroke="none" stroke-width="1"/><circle cx="68" cy="184" r="3.2" fill="#C8A46E" stroke="none" stroke-width="1"/><circle cx="84" cy="182" r="3.2" fill="#C8A46E" stroke="none" stroke-width="1"/><circle cx="98" cy="18