text x="438" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">warm</text><line x1="120" y1="140" x2="120.8" y2="140" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="128,140 120.8,144.4 120.8,135.6" fill="var(--muted, #47506E)"/><line x1="236" y1="140" x2="236.8" y2="140" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="244,140 236.8,144.4 236.8,135.6" fill="var(--muted, #47506E)"/><line x1="352" y1="140" x2="352.8" y2="140" stroke="var(--muted, #47506E)" stroke-width="2" stroke-linecap="round"/><polygon points="360,140 352.8,144.4 352.8,135.6" fill="var(--muted, #47506E)"/><text x="66" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">salt + sand + water</text><text x="182" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">salt dissolves</text><text x="298" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">sand stays on paper</text><text x="414" y="214" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #47506E)">water leaves, salt stays</text><line x1="20" x2="460" y1="236" y2="236" stroke="var(--line, #D0D8E8)"/><rect x="40.5" y="250.5" width="7" height="7" fill="var(--surface, #fff)" stroke="var(--ink, #12172B)" stroke-width="1.4"/><text x="54" y="258" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">salt grain</text><circle cx="144" cy="254" r="2.6" fill="var(--ink, #12172B)" stroke="none" stroke-width="1.5"/><text x="152" y="258" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">salt bits (too small to see)</text><circle cx="342" cy="254" r="3.2" fill="#C8A46E" stroke="none" stroke-width="1.5"/><text x="352" y="258" text-anchor="start" font-size="12" font-weight="400" fill="var(--ink, #12172B)">sand</text><text x="240" y="288" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Dissolved salt is not gone. It is still in the water.</text><text x="240" y="308" text-anchor="middle" font-size="13.5" font-weight="400" fill="var(--ink, #12172B)">Filtering takes out the sand. Evaporating brings the salt back.</text></svg>
