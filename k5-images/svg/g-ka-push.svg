<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-labelledby="g-ka-push-t g-ka-push-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="g-ka-push-t">How far the car rolled</title><desc id="g-ka-push-d">Bar graph, How far the car rolled. The number line starts at 0 on the right and counts up to the left. Soft push 2 floor tiles, about 60 centimeters. Strong push 6 floor tiles, about 180 centimeters.</desc><rect x="0" y="0" width="480" height="270" fill="var(--surface, #fff)"/><text x="240" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">How far the car rolled</text><line x1="440" x2="440" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="440" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">0</text><line x1="395" x2="395" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="395" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">1</text><line x1="350" x2="350" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="350" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">2</text><line x1="305" x2="305" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="305" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">3</text><line x1="260" x2="260" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="260" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">4</text><line x1="215" x2="215" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="215" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">5</text><line x1="170" x2="170" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="170" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">6</text><line x1="125" x2="125" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="125" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">7</text><line x1="80" x2="80" y1="56" y2="196" stroke="var(--line, #D0D8E8)" stroke-width="1"/><text x="80" y="214" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">8</text><text x="80" y="76" font-size="13.5" fill="var(--ink, #12172B)">Soft push</text><rect x="350" y="82" width="90" height="30" rx="3" fill="var(--reflect, #2B66E8)"/><text x="342" y="103" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink, #12172B)">2</text><text x="80" y="136" font-size="13.5" fill="var(--ink, #12172B)">Strong push</text><rect x="170" y="142" width="270" height="30" rx="3" fill="var(--reflect, #2B66E8)"/><text x="162" y="163" text-anchor="end" font-size="14" font-weight="700" fill="var(--ink, #12172B)">6</text><line x1="440" x2="440" y1="52" y2="198" stroke="var(--ink, #12172B)" stroke-width="2"/><text x="440" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink, #12172B)">start</text><text x="240" y="240" text-anchor="middle" font-size="13" fill="var(--muted, #47506E)">Floor tiles (1 tile is about 30 centimeters, or 1 foot)</text><text x="240" y="258" text-anchor="middle" font-size="12" fill="var(--muted, #47506E)">Zero is on the right.</text></svg>
