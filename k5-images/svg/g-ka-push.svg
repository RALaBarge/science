><text x="361.5" y="107.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink, #12172B)">6</text><text x="361.5" y="288" text-anchor="middle" font-size="13.5" fill="var(--ink, #12172B)">Strong push</text><line x1="54" x2="464" y1="268" y2="268" stroke="var(--ink, #12172B)" stroke-width="1.5"/></svg>
