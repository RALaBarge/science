<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img" aria-labelledby="b54-lakes-t b54-lakes-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b54-lakes-t">The Great Lakes hold a lot of fresh water</title><desc id="b54-lakes-d">A row of five water drops. One drop is filled blue for the Great Lakes and four are empty outlines for the rest of the world's lake and river fresh water. A note says the oceans are still the most water.</desc><rect x="0" y="0" width="480" height="250" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">The Great Lakes hold a lot of fresh water</text><path d="M70 70 Q44 130 70 156 Q96 130 70 70Z" fill="var(--reflect, #2B66E8)" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M150 70 Q124 130 150 156 Q176 130 150 70Z" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M230 70 Q204 130 230 156 Q256 130 230 70Z" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M310 70 Q284 130 310 156 Q336 130 310 70Z" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><path d="M390 70 Q364 130 390 156 Q416 130 390 70Z" fill="none" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="70" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">Great Lakes</text><text x="124" y="210" text-anchor="start" font-size="12.5" font-weight="700" fill="var(--ink, #12172B)">all the other lakes and rivers on Earth</text><text x="240" y="238" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">One fifth of the surface fresh water. Ocean water is still most of all water.</text></svg>