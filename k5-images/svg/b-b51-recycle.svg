<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" role="img" aria-labelledby="b51-recycle-t b51-recycle-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b51-recycle-t">Sorting materials by property</title><desc id="b51-recycle-d">Three recycling bins labeled paper, metal and plastic with examples in each. A note says properties like magnetism and floating help sort materials.</desc><rect x="0" y="0" width="480" height="290" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Sorting materials by property</text><rect x="20" y="100" width="120" height="110" rx="8" fill="var(--reflect, #2B66E8)" fill-opacity="0.35" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="80" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Paper</text><text x="80" y="180" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">newspaper, boxes</text><rect x="180" y="100" width="120" height="110" rx="8" fill="var(--surface-2, #E8EDF6)" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="240" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Metal</text><text x="240" y="180" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">cans, foil</text><rect x="340" y="100" width="120" height="110" rx="8" fill="var(--beam, #F2A900)" fill-opacity="0.4" stroke="var(--ink, #12172B)" stroke-width="3"/><text x="400" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink, #12172B)">Plastic</text><text x="400" y="180" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">bottles, jugs</text><text x="240" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Machines and people use properties to sort:</text><text x="240" y="270" text-anchor="middle" font-size="12.5" font-weight="400" fill="var(--ink, #12172B)">magnets pick up steel cans; air or water separate light things.</text></svg>