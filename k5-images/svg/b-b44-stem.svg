<svg class="k5i-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="b44-stem-t b44-stem-d" font-family="var(--font-body, system-ui, sans-serif)"><title id="b44-stem-t">Tubes inside a stem</title><desc id="b44-stem-d">A plant stem cut open to show tiny tubes. One set of tubes carries water up from the roots to the leaves. Another set carries sugar from the leaves down to the rest of the plant.</desc><rect x="0" y="0" width="480" height="300" fill="var(--surface, #fff)"/><text x="240" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="var(--ink, #12172B)">Tubes inside a stem</text><rect x="180" y="50" width="120" height="210" rx="14" fill="var(--green, #25904F)" fill-opacity=".35" stroke="var(--ink, #12172B)" stroke-width="3"/><rect x="205" y="66" width="20" height="180" rx="10" fill="var(--reflect, #2B66E8)" fill-opacity=".6" stroke="var(--ink, #12172B)" stroke-width="1.5"/><rect x="255" y="66" width="20" height="180" rx="10" fill="var(--absorb, #D6450B)" fill-opacity=".6" stroke="var(--ink, #12172B)" stroke-width="1.5"/><line x1="215" y1="220" x2="215.0" y2="93.9" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="215,84 221.1,93.9 208.9,93.9" fill="var(--ink, #12172B)"/><line x1="265" y1="84" x2="265.0" y2="210.1" stroke="var(--ink, #12172B)" stroke-width="3" stroke-linecap="round"/><polygon points="265,220 258.9,210.1 271.1,210.1" fill="var(--ink, #12172B)"/><text x="130" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--reflect, #2B66E8)">water</text><text x="130" y="146.47" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--reflect, #2B66E8)">goes up</text><text x="350" y="130" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--absorb, #D6450B)">sugar</text><text x="350" y="146.47" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--absorb, #D6450B)">goes down</text><text x="240" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--ink, #12172B)">Tiny tubes carry them like pipes.</text></svg>