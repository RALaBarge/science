<div class="k5w" id="w2cwind"></div>
<script>(function(){var box=document.getElementById('w2cwind'),K=K5W,S=K.S,C=K.C;
 var grass=0,svg,say,timer=0,t=0;
 var G=[[190,150],[215,142],[240,134],[265,142],[290,150],[205,152],[230,144],[255,138],[280,152],[225,150],[250,150],[275,146],[200,146],[245,152]];
 var BARE=[60,90,40,110,70,130,50,100,80,120,45,95,75,105],HELD=[0,0,22,0,0,0,0,18,0,0,0,25,0,0];
 K.chips(box,['Bare sand','Sand with grass'],0,function(i){grass=i;idle();},'Ground');
 svg=K.svg(box,'0 0 480 200','A mound of sand with wind blowing across it.');
 K.btn(box,'Start the wind',go);K.btn(box,'Reset',idle);
 say=K.say(box);
 function draw(p){
  var s=S.l(20,170,460,170,C.ink,3)+'<path d="M160 170 Q240 105 320 170Z" fill="#e0c389" stroke="'+C.ink+'" stroke-width="2"/>',moved=0;
  if(grass){for(var i=0;i<11;i++){var x=176+i*14;s+=S.l(x,162-Math.abs(5-i)*2,x-3,142-Math.abs(5-i)*3,C.teal,2.5);s+=S.l(x,162-Math.abs(5-i)*2,x+4,146-Math.abs(5-i)*3,C.teal,2.5);}}
  for(var k=0;k<G.length;k++){var d=(grass?HELD[k]:BARE[k])*p;if(d>0)moved++;s+=S.c(G[k][0]+d,G[k][1]-(d>0?Math.sin(p*3.14)*18:0),4,'#c8a46e',C.ink,1.2);}
  if(p>0&&p<1)for(var j=0;j<4;j++)s+=S.a(120,70+j*22,190+30*j,70+j*22,C.blue,2.5,8);
  svg.innerHTML=s;return moved;
 }
 function idle(){clearInterval(timer);draw(0);say('Pick the ground, then press <b>Start the wind</b>.');}
 function go(){clearInterval(timer);t=0;timer=setInterval(function(){t+=.04;var m=draw(Math.min(1,t));if(t>=1){clearInterval(timer);say(grass?'With grass, only <b>'+m+' of 14</b> grains moved, and not far. Plant roots and blades hold the sand and slow the wind near the ground.':'On bare sand, <b>'+m+' of 14</b> grains moved away. Wind moves sand little by little, and bare sand has nothing to stop it.');}},30);}
 idle();
})();</script>
