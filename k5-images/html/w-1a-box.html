<div class="k5w" id="w1abox"></div>
<script>(function(){var box=document.getElementById('w1abox'),K=K5W,S=K.S,C=K.C;
 var lamp=false,obj=0,svg,say;
 K.chips(box,['Apple in the box','Glow star in the box'],0,function(i){obj=i;draw();},'What is in the box');
 svg=K.svg(box,'0 0 480 240','A box with an object inside, a lamp and an eye.');
 K.btn(box,'Lamp: off (press to turn on)',function(){lamp=!lamp;draw();});
 say=K.say(box);
 function draw(){
  var seen=obj===1||lamp,s='';
  s+=S.r(150,100,150,100,'#2a2740',C.ink,8,3)+S.t(225,218,'mystery box',12,C.muted);
  s+=S.r(150,100,150,16,'none','none',0,0);
  if(!seen)s+=S.t(225,170,'?',40,'#6b6a85','middle',700);
  else if(obj===0)s+=S.c(225,160,22,C.bad,C.ink,2.5)+S.p('225,138 232,126 240,134',C.teal,C.ink,1.5);
  else s+=S.p('225,134 232,152 250,152 236,164 242,182 225,171 208,182 214,164 200,152 218,152',C.beam,C.ink,2)+S.c(225,160,34,'none',C.beam,2)+S.c(225,160,44,'none',C.beam,1.5);
  s+=S.c(60,50,16,lamp?C.beam:C.surf,C.ink,2.5);
  if(lamp){for(var i=0;i<10;i++){var a=i/10*6.283;s+=S.l(60+Math.cos(a)*22,50+Math.sin(a)*22,60+Math.cos(a)*32,50+Math.sin(a)*32,C.beam,3);}}
  s+=S.t(60,88,'lamp',12,C.muted);
  s+='<path d="M388 150 Q420 118 452 150 Q420 182 388 150Z" fill="'+C.surf+'" stroke="'+C.ink+'" stroke-width="2.5"/>'+S.c(420,150,11,C.blue,C.ink,1.5)+S.c(420,150,5,C.ink)+S.t(420,198,'eye',12,C.muted);
  if(lamp&&obj===0)s+=S.a(80,62,200,138,C.beam,4,12);
  if(seen)s+=S.a(300,152,384,150,obj===1?C.beam:C.blue,4,12);
  svg.innerHTML=s;
  box.querySelector('.btns button').textContent='Lamp: '+(lamp?'on (press to turn off)':'off (press to turn on)');
  say(seen?(obj===1?'You can see the <b>glow star</b> because it <b>makes its own light</b>, and that light goes into your eye.':'You can see the <b>apple</b>. Light from the lamp hits it and <b>bounces into your eye</b>. Nothing comes out of the eye.'):'You see <b>nothing</b>. With the lamp off, no light reaches the apple, so no light bounces to your eye. Turn the lamp on, or try the glow star.');
  svg.setAttribute('aria-label',seen?'You can see the '+(obj?'glow star':'apple')+'.':'The box looks dark. You see nothing.');
 }
 draw();
})();</script>
