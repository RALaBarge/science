<div class="k5w" id="w31magnet"></div>
<script>(function(){var box=document.getElementById('w31magnet'),K=K5W,S=K.S,C=K.C;
 var MAT=[['Iron nail',1,'Iron is magnetic.'],['Aluminum foil',0,'Aluminum is a metal but it is <b>not</b> magnetic.'],['Penny',0,'A penny is not magnetic.'],['Steel paper clip',1,'Steel contains iron, so it is magnetic.']];
 var m=0,d=3,paper=0,svg,say;
 K.chips(box,MAT.map(function(x){return x[0];}),0,function(i){m=i;draw();},'Material');
 K.chips(box,['Nothing between','A sheet of paper between'],0,function(i){paper=i;draw();},'Between');
 svg=K.svg(box,'0 0 480 170','A magnet on the left and an object some distance away.');
 K.slider(box,'Distance from the magnet',1,10,1,3,function(v){return v+' cm';},function(v){d=v;draw();});
 say=K.say(box);
 function draw(){
  var pull=MAT[m][1]?Math.max(0,1-(d-1)/6):0,x=60+d*36,ox=pull>.2?96:x,s=S.r(20,70,60,36,C.red,C.ink,4,2.5)+S.r(20,70,30,36,C.blue,C.ink,4,2.5)+S.t(35,93,'N',16,'#fff','middle',700)+S.t(65,93,'S',16,'#fff','middle',700);
  if(paper)s+=S.r(84,58,6,60,'#ffffff',C.ink,1,1.5)+S.t(87,50,'paper',11,C.muted);
  s+=S.r(ox,78,44,20,pull>.2?C.beam:C.surf2,C.ink,5,2.5)+S.t(ox+22,128,MAT[m][0],12,C.ink);
  s+=S.t(60,150,'magnet',12,C.muted)+S.t(380,26,'pull strength',12,C.muted)+S.r(310,34,140,12,C.surf2,C.ink,5,1.5)+S.r(310,34,140*pull,12,C.teal,'none',5,0);
  svg.innerHTML=s;
  say(MAT[m][2]+' '+(MAT[m][1]?(pull>.2?'At <b>'+d+' cm</b> the pull is strong enough that it <b>jumps to the magnet</b>'+(paper?', even through the paper. A magnet can pull without touching.':'.'):'At <b>'+d+' cm</b> it is too far: the pull gets weaker with distance. Slide it closer.'):'So the magnet does <b>nothing</b> to it, near or far.'));
 }
 draw();
})();</script>
