<div class="k5w" id="w43eye"></div>
<script>(function(){var box=document.getElementById('w43eye'),K=K5W,S=K.S,C=K.C;
 var lamp=true,wrong=false,svg,say;
 K.chips(box,['Lamp on','Lamp off'],0,function(i){lamp=i===0;draw();},'Lamp');
 K.chips(box,['How seeing works','A wrong idea: light from the eye'],0,function(i){wrong=i===1;draw();},'Idea');
 svg=K.svg(box,'0 0 480 230','A lamp, an apple and an eye.');

 function draw(){
  var s=S.c(60,70,16,lamp?C.beam:C.surf,C.ink,2.5);
  if(lamp)for(var i=0;i<10;i++){var a=i/10*6.283;s+=S.l(60+Math.cos(a)*22,70+Math.sin(a)*22,60+Math.cos(a)*34,70+Math.sin(a)*34,C.beam,3);}
  s+=S.t(60,110,'lamp',12,C.muted)+S.c(235,150,30,C.bad,C.ink,2.5)+S.p('235,120 243,106 252,114',C.teal,C.ink,1.5)+S.t(235,198,'apple',12,C.muted);
  s+='<path d="M368 150 Q412 112 456 150 Q412 188 368 150Z" fill="'+C.surf+'" stroke="'+C.ink+'" stroke-width="2.5"/>'+S.c(412,150,14,C.blue,C.ink,1.5)+S.c(412,150,6,C.ink)+S.t(412,204,'eye',12,C.muted);
  if(!wrong){
   if(lamp)s+=S.a(78,84,206,134,C.beam,4,12)+S.a(266,150,366,150,C.blue,4,12)+S.t(232,92,'1 light from the lamp hits the apple',11,C.ink,'start')+S.t(316,136,'2 light bounces into the eye',11,C.ink,'middle');
  }else{
   s+=S.a(366,150,270,150,C.bad,3,10).replace('<line ','<line stroke-dasharray="6 5" ')+S.t(316,136,'light from eye?',12,C.bad,'middle',700)+S.l(300,134,330,166,C.bad,4)+S.l(330,134,300,166,C.bad,4);
  }

  say(wrong?'<b>This is a wrong idea.</b> Eyes do <b>not</b> shoot out beams. Nothing leaves the eye. Turn the lamp off: the apple is still not seen, which shows the light has to come from somewhere else first.':lamp?'Light from the lamp <b>hits the apple</b> and <b>bounces into the eye</b>. That is how we see it. The apple does not make its own light and nothing comes out of the eye.':'With the lamp off there is no light to bounce, so you cannot see the apple. We see things because <b>light comes in</b>.');

 }
